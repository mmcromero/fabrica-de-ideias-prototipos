--purple);border-color:#d7c7f3}.btn.light{background:#f3edff;color:var(--purple);border-color:#f3edff}.btn.small{padding:8px 11px;font-size:12px}.content{max-width:1390px;margin:auto;padding:35px 36px 90px}.eyebrow{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--purple);font-weight:850}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:27px}.heading h1{font-size:clamp(26px,3.3vw,37px);letter-spacing:-1.3px;margin:7px 0}.heading p{color:var(--muted);margin:0;font-size:14px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:22px;box-shadow:var(--shadow);min-width:0}.span3{grid-column:span 3}.span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:span 12}.metric{font-size:31px;font-weight:850;letter-spacing:-1px;margin:11px 0 4px}.muted{color:var(--muted);font-size:13px}.card h2{font-size:17px;margin:0 0 17px;letter-spacing:-.35px}.card h3{font-size:15px;margin:0 0 9px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:12px}.item{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px;border:1px solid #eeeaf4;border-radius:13px}.item strong{font-size:13px}.item small{display:block;color:var(--muted);margin-top:4px}.tag{display:inline-block;padding:6px 9px;border-radius:999px;background:#e9f8f0;color:#23774a;font-size:11px;font-weight:800;white-space:nowrap}.tag.orange{background:#fff2e1;color:#ad6615}.tag.purple{background:#f0e9ff;color:#6634c5}.tag.red{background:#fff0f0;color:#b84747}.quick{background:#f6f1ff;border:1px solid #e7d9ff;border-radius:15px;padding:18px}.quick h3{margin:0 0 6px}.quick p{font-size:12px;color:#75668d;line-height:1.5}.quick button{margin-top:8px}.field{display:grid;gap:7px;margin:0 0 15p .role-compact .sidebar,.role-compact .mobilebar{display:none!important}.role-compact .app{display:block}.role-compact .main{width:100%;max-width:740px;margin:auto;min-height:100vh}.role-compact .topbar{flex-wrap:wrap}.role-compact .content{padding-bottom:40px}.demo-home-link{position:fixed;right:12px;bottom:12px;z-index:9999;background:#211335;color:white;text-decoration:none;padding:10px 14px;border-radius:12px;box-shadow:0 6px 24px #0003;font:600 13px system-ui}</style></head><body><div id="root"></div><script>
let MENU=[['Visão geral','◈','dashboard','Principal'],['Agenda','▦','agenda','Principal'],['Agendamentos','◷','reservas','Principal'],['Clientes','♙','clientes','Gestão'],['Serviços','✂','servicos','Gestão'],['Profissionais','♧','profissionais','Gestão'],['Horários e bloqueios','◴','horarios','Gestão'],['Identidade visual','◉','identidade','Configurações'],['Estabelecimento','⌂','estabelecimento','Configurações'],['Notificações','✉','notificacoes','Configurações'],['Pagamentos e Pix','◇','pagamentos','Configurações'],['Importação','⇧','importacao','Configurações'],['Relatórios','▥','relatorios','Análises'],['Planos e cobrança','▣','planos','Conta'],['Equipe e permissões','♟','equipe','Conta'],['Portal profissional','♧','profissional','Portais'],['Portal do cliente','♡','publico','Portais'],['Super Admin','⚙','superadmin','Plataforma']];
const seed={tenant:'Ateliê Aurora',primary:'#275d73',secondary:'#f0ae77',services:[{name:'Corte e finalização',duration:45,price:75},{name:'Barba completa',duration:30,price:45},{name:'Hidratação',duration:60,price:95}],staff:['Ana Martins','Bruno Costa','Carla Lima'],clients:[{name:'Marina Souza',phone:'(11) 99999-1111',visits:8},{name:'Rafael Lima',phone:'(11) 98888-2222',visits:4},{name:'Joana Dias',phone:'(11) 97777-3333',visits:2}],bookings:[{client:'Marina Souza',service:'Corte e finalização',staff:'Ana Martins',time:'09:00',status:'Confirmado'},{client:'Rafael Lima',service:'Barba completa',staff:'Bruno Costa',time:'10:30',status:'Pendente'},{client:'Joana Dias',service:'Hidratação',staff:'Carla Lima',time:'14:00',status:'Confirmado'}]};let state=JSON.parse(JSON.stringify(seed));let page='dashboard',bookingStep=0,chosen={},toastTimer,modal='',activeTab='Dia',tenantView='aurora';const root=document.getElementById('root');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const button=(txt,act,cls='')=>`<button class="btn ${cls}" data-act="${act}">${txt}</button>`;const tag=(s)=>`<span class="tag ${s==='Pendente'?'orange':s==='Cancelado'?'red':'purple'}">${esc(s)}</span>`;const field=(label,key,value='',type='text')=>`<div class="field"><label for="${key}">${label}</label><input id="${key}" type="${type}" value="${esc(value)}"></div>`;const head=(title,desc,action='')=>`<div class="heading"><div><div class="eyebrow">Pode Vir / Protótipo navegável</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`;const card=(title,body,span='span6')=>`<section class="card ${span}"><h2>${title}</h2>${body}</section>`;function toast(msg){document.querySelector('.toast')?.remove();const n=document.createElement('div');n.className='toast';n.textContent=msg+' · Simulação, sem gravação real';document.body.append(n);clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),3600)}function nav(id){page=id;modal='';render();window.scrollTo({top:0,behavior:'smooth'})}function shell(body){let last='';const menu=MENU.map(([label,ico,id,group])=>`${group!==last?`<div class="side-label">${last=group}</div>`:''}<button class="nav-btn ${page===id?'active':''}" data-nav="${id}"><span class="nav-icon">${ico}</span>${label}</button>`).join('');root.innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><span class="brandmark">✓</span> Pode Vir</div><div class="chip" style="margin:0 10px 10px">DEMO · Dados fictícios</div>${menu}<div class="sidebar-foot">Protótipo integralmente local.<br>Sem login, banco ou pagamentos reais.</div></aside><main class="main"><header class="topbar"><strong>✦ ${esc(state.tenant)} <span class="muted">/ Espaço demonstrativo</span></strong><div class="top-actions"><span class="chip">● Modo demonstração</span>${button('Ver portal público','publico','outline small')}</div></header><div class="content">${body}<div class="footer-note">Pode Vir · Protótipo para revisão de navegação e requisitos. Dados fictícios; nada é enviado a servidores.</div></div></main></div><nav class="mobilebar">${[['◈','Início','dashboard'],['▦','Agenda','agenda'],['◷','Reservas','reservas'],['♙','Clientes','clientes'],['☰','Menu','menu']].map(([i,l,id])=>`<button data-nav="${id}"><span>${i}</span>${l}</button>`).join('')}</nav>${modal?modalHtml():''}`;document.documentElement.style.setProperty('--tenant',state.primary)}
function dashboard(){return head('Seu negócio, em um só lugar','Uma visão rápida da operação do estabelecimento fictício.',button('+ Novo agendamento','newbooking'))+`<div class="grid">${[['Agendamentos hoje','12','+ 3 em relação a ontem'],['Clientes cadastrados','248','18 novos este mês'],['Receita prevista',money(1280),'Valores ilustrativos'],['Taxa de ocupação','76%','Estimativa fictícia']].map(([a,b,c])=>`<section class="card span3"><div class="muted">${a}</div><div class="metric">${b}</div><div class="mini">${c}</div></section>`).join('')}${card('Próximos atendimentos',`<div class="stack">${state.bookings.map(b=>`<div class="item"><div><strong>${esc(b.time)} · ${esc(b.client)}</strong><small>${esc(b.service)} · ${esc(b.staff)}</small></div>${tag(b.status)}</div>`).join('')}</div><div style="margin-top:16px">${button('Abrir agenda','agenda','outline small')}</div>`,'span8')}${card('Acesso rápido',`<div class="stack">${[['Abrir agendamento público','publico','Veja a experiência do cliente'],['Personalizar a marca','identidade','Nome, cores e identidade'],['Cadastrar serviço','addservice','Simule um novo serviço'],['Ver equipe','profissionais','Profissionais e permissões']].map(([t,a,d])=>`<div class="quick"><h3>${t}</h3><p>${d}</p>${button('Abrir →',a,'outline small')}</div>`).join('')}</div>`,'span4')}</div>`}
function agenda(){return head('Agenda do estabelecimento','Visualize horários, atendimentos e bloqueios fictícios.',button('+ Agendar','newbooking'))+`<div class="toolbar">${['Dia','Semana','Mês'].map(t=>`<button class="tab ${activeTab===t?'active':''}" data-tab="${t}">${t}</button>`).join('')}<button class="tab" data-act="block">+ Bloquear horário</button></div><div class="card"><div class="row" style="margin-bottom:16px"><strong>${activeTab==='Dia'?'Agenda de hoje':activeTab==='Semana'?'Semana demonstrativa':'Mês demonstrativo'}</strong><span class="muted">Horários fictícios · São Paulo</span></div><div class="tablewrap"><div class="calendar"><div class="calcell calhead">Horário</div>${['Seg · Ana','Ter · Bruno','Qua · Carla','Qui · Ana','Sex · Bruno'].map(x=>`<div class="calcell calhead">${x}</div>`).join('')}${['09:00','10:00','11:00','13:00','14:00','15:00'].map((t,i)=>`<div class="calcell time">${t}</div>${[0,1,2,3,4].map((d)=>`<div class="calcell">${(i+d)%3===0?`<div class="booking ${d%2?'green':''}">${['Marina · Corte','Rafael · Barba','Joana · Hidratação'][(i+d)%3]}<br>${t}</div>`:''}</div>`).join('')}`).join('')}</div></div></div>`}
function tablePage(title,desc,columns,rows,action){return head(title,desc,action)+card(title,`<div class="tablewrap"><table><thead><tr>${columns.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`,'span12').replace('class="card span12"','class="card span12"')}
function reservas(){return tablePage('Agendamentos','Consulte e simule mudanças no status dos atendimentos.',['Horário','Cliente','Serviço','Profissional','Situação','Ação'],state.bookings.map((b,i)=>[esc(b.time),esc(b.client),esc(b.service),esc(b.staff),tag(b.status),`<button class="tab" data-act="togglebooking:${i}">Alterar status</button>`]),button('+ Novo agendamento','newbooking'))}
function clientes(){return tablePage('Clientes','Cadastro, histórico e relacionamento com dados sintéticos.',['Nome','WhatsApp fictício','Atendimentos','Ação'],state.clients.map((c,i)=>[esc(c.name),esc(c.phone),c.visits,`<button class="tab" data-act="client:${i}">Ver ficha</button>`]),button('+ Adicionar cliente','addclient'))}
function servicos(){return head('Serviços','Catálogo de serviços, duração e preço por estabelecimento.',button('+ Novo serviço','addservice'))+`<div class="grid">${state.services.map((s,i)=>card(esc(s.name),`<p class="muted">Duração: ${s.duration} minutos</p><div class="metric">${money(s.price)}</div>${button('Editar serviço','service:'+i,'outline small')}`,'span4')).join('')}</div>`}
function profissionais(){return head('Profissionais','Equipe, especialidades e agendas independentes.',button('+ Novo profissional','addstaff'))+`<div class="grid">${state.staff.map((s,i)=>card(`<span style="font-size:25px">${['👩🏽‍💼','👨🏻‍💼','👩🏻‍💼'][i%3]}</span> ${esc(s)}`,`<p class="muted">Profissional ativo · Agenda habilitada</p><div class="row"><span class="tag">Disponível</span>${button('Ver agenda','agenda','outline small')}</div>`,'span4')).join('')}</div>`}
function horarios(){return head('Horários e bloqueios','Configure jornadas, intervalos, folgas e exceções.')+`<div class="grid">${card('Expediente semanal',`<div class="stack">${['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'].map((d,i)=>`<div class="item"><strong>${d}</strong><span class="muted">${i<5?'09:00 – 18:00':i===5?'09:00 – 13:00':'Fechado'}</span></div>`).join('')}</div><div style="margin-top:15px">${button('Editar horários','hours','outline small')}</div>`,'span7')}${card('Bloqueios e folgas',`<div class="notice">Exemplo: horário de almoço, férias e ausências. Os bloqueios não afetam disponibilidade real.</div><div style="margin-top:15px">${button('+ Novo bloqueio','block')}</div>`,'span5')}</div>`}
function identidade(){return head('Identidade visual','A marca do estabelecimento aparece no painel e no portal do cliente.')+`<div class="grid">${card('Personalização',`<div class="field"><label>Nome comercial</label><input id="tenantName" value="${esc(state.tenant)}"></div><div class="formgrid">${field('Cor principal','tenantPrimary',state.primary,'color')}${field('Cor secundária','tenantSecondary',state.secondary,'color')}</div><div class="field"><label>Logotipo do estabelecimento</label><input type="file" accept="image/png,image/jpeg,image/webp" id="logoUpload"><small class="mini">Somente prévia local; não é enviado ou salvo.</small></div>${button('Aplicar na demonstração','savebrand')}`,'span6')}${card('Prévia em tempo real',`<div class="preview"><div class="preview-top"><strong style="font-size:20px">✦ ${esc(state.tenant)}</strong><p>Agende seu horário com facilidade</p></div><div class="preview-bottom"><strong>Serviços disponíveis</strong><p class="muted">Corte e finalização · 45 minutos</p>${button('Agendar agora','publico')}</div></div><p class="mini">A identidade do Pode Vir fica no site institucional; esta área usa a marca do estabelecimento.</p>`,'span6')}</div>`}
function estabelecimento(){return head('Estabelecimento','Dados comerciais e regras de atendimento.')+`<div class="grid">${card('Informações',`<div class="formgrid">${field('Nome comercial','bizname',state.tenant)}${field('Telefone','bizphone','(11) 90000-0000')}${field('Endereço','bizaddress','Rua das Flores, 120 · São Paulo')}${field('Link público','bizslug','atelie-aurora')}</div>${button('Simular salvamento','fake')}`,'span8')}${card('Regras',`<div class="stack"><div class="item"><strong>Antecedência mínima</strong><span>2 horas</span></div><div class="item"><strong>Cancelamento</strong><span>Até 12 horas</span></div><div class="item"><strong>Intervalo entre serviços</strong><span>10 min</span></div><div class="item"><strong>Fuso horário</strong><span>São Paulo</span></div></div>`,'span4')}</div>`}
function settingsPage(title,desc,blocks){return head(title,desc)+`<div class="grid">${blocks.map(([t,d,a],i)=>card(t,`<p class="muted" style="line-height:1.7">${d}</p>${button('Explorar','feature:'+a,'outline small')}`,'span4')).join('')}</div>`}
function relatorios(){return head('Relatórios','Indicadores demonstrativos; não representam dados reais.')+`<div class="grid">${[['Atendimentos no mês','184'],['Receita estimada',money(12750)],['Novos clientes','31'],['Cancelamentos','7']].map(([t,v])=>card(t,`<div class="metric">${v}</div><div class="progress"><span style="width:${35+Math.round(Math.random()*50)}%"></span></div>`,'span3')).join('')}${card('Serviços mais agendados',`<div class="stack">${state.services.map((s,i)=>`<div class="item"><strong>${esc(s.name)}</strong><span>${[46,32,22][i%3]}%</span></div>`).join('')}</div>`,'span7')}${card('Resumo operacional',`<p class="muted">Filtros por período, profissional e serviço serão refinados após a revisão do protótipo.</p>${button('Exportar relatório fictício','fake','outline')}`,'span5')}</div>`}
function plans(){return head('Planos e cobrança','Referências comerciais sujeitas à validação econômica. Nenhuma cobrança é realizada.')+`<div class="grid">${[['Básico','29,90','Agenda, serviços, profissionais e clientes'],['Prioritário','49,90','Recursos essenciais com suporte e configuração assistida propostos']].map(([t,p,d])=>card(t,`<div class="metric">R$ ${p}<span class="muted"> / mês</span></div><p class="muted">${d}</p><span class="tag orange">Valores de referência</span><div style="margin-top:18px">${button('Simular escolha','fake','outline')}</div>`,'span6')).join('')}</div>`}
function equipe(){return settingsPage('Equipe e permissões','Perfis e limites de acesso do estabelecimento.',[['Administrador','Gerencia serviços, profissionais, clientes, horários e configurações.','admin'],['Profissional','Consulta sua agenda e bloqueia seus horários.','staff'],['Convites e acesso','Simulação de convites, permissões e revogação.','invite']])}
function profissional(){return head('Portal profissional','Visão fictícia do profissional, com acesso apenas à própria agenda.')+`<div class="grid">${card('Bem-vinda, Ana!',`<p class="muted">Seus próximos atendimentos</p><div class="stack">${state.bookings.filter(b=>b.staff==='Ana Martins').map(b=>`<div class="item"><strong>${esc(b.time)} · ${esc(b.client)}</strong>${tag(b.status)}</div>`).join('')}</div><div style="margin-top:18px">${button('Bloquear horário','block')}</div>`,'span7')}${card('Seu acesso',`<p class="muted">Profissionais não veem configurações de outros estabelecimentos ou relatórios globais.</p><div class="notice">Prévia de permissões. Nenhuma autenticação real está ativa.</div>`,'span5')}</div>`}
function superadmin(){return head('Super Admin · Plataforma','Área conceitual da operação do Pode Vir, separada dos estabelecimentos.')+`<div class="grid">${[['Estabelecimentos piloto','5'],['Assinaturas ativas','0'],['Receita recorrente','R$ 0'],['Alertas','2']].map(([t,v])=>card(t,`<div class="metric">${v}</div><div class="mini">Indicador demonstrativo</div>`,'span3')).join('')}${card('Estabelecimentos',`<div class="stack">${['Ateliê Aurora','Barbearia Central','Studio Bela','Espaço Zen','Clínica Horizonte'].map((x,i)=>`<div class="item"><strong>${x}</strong><span class="tag ${i?'orange':''}">${i?'Exemplo':'Piloto fictício'}</span></div>`).join('')}</div>`,'span8')}${card('Controles da plataforma',`<div class="stack">${['Assinaturas','Limites de uso','Suporte','Auditoria e segurança'].map(t=>`<div class="item"><strong>${t}</strong><button class="tab" data-act="fake">Abrir</button></div>`).join('')}</div>`,'span4')}</div>`}
function publicPage(){let names=['Escolha o serviço','Escolha o profissional','Escolha a data e horário','Seus dados','Confirme o agendamento','Agendamento demonstrativo'];let body='';if(bookingStep===0)body=state.services.map((s,i)=>`<button class="choice ${chosen.service===i?'selected':''}" data-pick="service:${i}"><strong>${esc(s.name)} · ${money(s.price)}</strong><small>${s.duration} min · Serviço demonstrativo</small></button>`).join('');if(bookingStep===1)body=['Sem preferência',...state.staff].map((s,i)=>`<button class="choice ${chosen.staff===i?'selected':''}" data-pick="staff:${i}"><strong>${esc(s)}</strong><small>${i===0?'Primeiro horário disponível':'Profissional fictício'}</small></button>`).join('');if(bookingStep===2)body=`<div class="field"><label>Data</label><input type="date" id="date" value="${chosen.date||'2026-11-18'}"></div><div class="tabs">${['09:00','10:30','11:45','14:00','15:30','17:00'].map(t=>`<button class="tab ${chosen.time===t?'active':''}" data-pick="time:${t}">${t}</button>`).join('')}</div><p class="mini">Disponibilidade simulada, sem consulta a banco de dados.</p>`;if(bookingStep===3)body=`${field('Nome completo','customerName',chosen.name||'')}${field('WhatsApp','customerPhone',chosen.phone||'','tel')}<p class="mini">O cliente não precisa criar uma senha.</p>`;if(bookingStep===4)body=`<div class="stack"><div class="item"><strong>Serviço</strong><span>${esc(state.services[chosen.service||0]?.name)}</span></div><div class="item"><strong>Profissional</strong><span>${esc(['Sem preferência',...state.staff][chosen.staff||0])}</span></div><div class="item"><strong>Data e hora</strong><span>${esc(chosen.date||'18/11/2026')} · ${esc(chosen.time||'09:00')}</span></div><div class="item"><strong>Cliente</strong><span>${esc(chosen.name||'Cliente fictício')}</span></div></div><p class="notice">Esta confirmação é fictícia. Nenhuma reserva será criada.</p>`;if(bookingStep===5)body=`<div style="text-align:center;padding:28px 0"><div style="font-size:56px">✓</div><h2>Horário demonstrativo!</h2><p class="muted">A navegação foi concluída. Nenhum agendamento real foi feito.</p><span class="tag">Código DEMO-2026</span></div>${button('Gerenciar reserva fictícia','managebooking','outline')}`;return head('Portal público do cliente','Experiência independente com a identidade do estabelecimento.')+`<div class="grid">${card('Simulação de identidade',`<p class="muted">Troque de estabelecimento para testar o isolamento visual.</p><div class="tabs"><button class="tab ${tenantView==='aurora'?'active':''}" data-tenant="aurora">Ateliê Aurora</button><button class="tab ${tenantView==='central'?'active':''}" data-tenant="central">Barbearia Central</button></div><div class="notice">O portal não mostra a marca Pode Vir. O painel à esquerda serve apenas para navegação de testes.</div><div style="margin-top:20px">${button('Reiniciar fluxo','resetbooking','outline')}</div>`,'span5')}${card('Prévia mobile',`<div class="phone"><div class="phone-head" style="background:${tenantView==='central'?'#263b32':esc(state.primary)}"><div class="fake-logo">${tenantView==='central'?'✂':'✦'}</div><h2>${tenantView==='central'?'Barbearia Central':esc(state.tenant)}</h2><small>Agende seu atendimento online</small></div><div class="phone-body"><div class="stepper">${names.map((_,i)=>`<span class="${i<=bookingStep?'done':''}"></span>`).join('')}</div><h3>${names[bookingStep]}</h3>${body}<div class="phone-actions">${bookingStep>0?button('Voltar','backbooking','outline'):''}${bookingStep<5?button(bookingStep===4?'Confirmar':'Continuar','nextbooking'):button('Recomeçar','resetbooking')}</div></div></div>`,'span7')}</div>`}
function modalHtml(){let title='',content='';if(modal==='newbooking'){title='Novo agendamento';content=`<div class="formgrid">${field('Nome do cliente','newName')}${field('WhatsApp','newPhone')}${field('Data','newDate','2026-11-18','date')}${field('Horário','newTime','10:00','time')}</div>${button('Adicionar à agenda fictícia','confirmbooking')}`}else if(modal==='addservice'||modal.startsWith('service:')){let i=Number(modal.split(':')[1]);let s=state.services[i]||{};title='Serviço demonstrativo';content=`${field('Nome do serviço','serviceName',s.name||'')}${field('Duração em minutos','serviceDuration',s.duration||45,'number')}${field('Preço em R$','servicePrice',s.price||50,'number')}${button('Aplicar na demonstração','confirmservice')}`}else if(modal==='addclient'){title='Novo cliente fictício';content=`${field('Nome','clientName')}${field('WhatsApp','clientPhone')}${button('Adicionar à lista fictícia','confirmclient')}`}else if(modal==='addstaff'){title='Novo profissional fictício';content=`${field('Nome','staffName')}${button('Adicionar profissional','confirmstaff')}`}else if(modal.startsWith('client:')){const c=state.clients[Number(modal.split(':')[1])];title=c?.name||'Cliente';content=`<p class="muted">WhatsApp: ${esc(c?.phone)}</p><p class="muted">Atendimentos: ${c?.visits}</p><div class="notice">Histórico e observações são ilustrativos.</div>`}else{title='Funcionalidade em prototipação';content='<p class="muted">Esta seção já está mapeada na navegação. O comportamento detalhado será refinado na revisão item a item.</p>'}return `<div class="modal-bg"><div class="modal"><div class="row"><h2>${title}</h2><button class="tab" data-act="close">✕</button></div><p class="mini">Apenas dados fictícios em memória, descartados ao recarregar.</p><div class="divider"></div>${content}</div></div>`}
function render(){let body=({dashboard,agenda,reservas,clientes,servicos,profissionais,horarios,identidade,estabelecimento,relatorios,planos:plans,equipe,profissional,publico:publicPage,superadmin})[page]?.();if(!body){const d={notificacoes:['Notificações e lembretes','Lembretes por WhatsApp, e-mail e confirmação de presença são itens de planejamento.',[['Mensagens automáticas','Modelos, gatilhos e consentimento ainda serão detalhados.','messages'],['Histórico de notificações','Eventos e falhas serão visíveis ao estabelecimento.','history'],['Preferências','Canais e regras por estabelecimento.','preferences']]],pagamentos:['Pagamentos e Pix','Sinal de reserva, regras de cobrança e conciliação são propostas futuras.',[['Sinal via Pix','Simulação de sinal antes do agendamento, sem integração financeira.','pix'],['Política de cancelamento','Regras de reembolso e não comparecimento.','refund'],['Histórico financeiro','Visão futura de recebimentos e pendências.','financial']]],importacao:['Importação de clientes','Planejamento da importação segura de cadastros.',[['Importar CSV','Prévia, mapeamento e validação de campos.','csv'],['Verificar duplicados','Revisão de contatos antes de importar.','duplicates'],['Privacidade','Consentimento, acesso e descarte seguro.','privacy']]]};body=settingsPage(...d[page])}shell(body)}
document.addEventListener('click',e=>{let t=e.target.closest('[data-nav],[data-act],[data-tab],[data-pick],[data-tenant]');if(!t)return;if(t.dataset.nav){if(t.dataset.nav==='menu'){modal='menu';shell(`<div class="heading"><h1>Menu completo</h1></div><div class="grid">${MENU.map(([n,ic,id])=>`<div class="card span4"><button class="tab" data-nav="${id}">${ic} ${n}</button></div>`).join('')}</div>`);return}nav(t.dataset.nav);return}if(t.dataset.tab){activeTab=t.dataset.tab;render();return}if(t.dataset.tenant){tenantView=t.dataset.tenant;bookingStep=0;chosen={};render();return}if(t.dataset.pick){let [k,v]=t.dataset.pick.split(':');chosen[k]=k==='time'?v:Number(v);render();return}let a=t.dataset.act;if(a==='close'){modal='';render();return}if(a==='nextbooking'){if(bookingStep===0&&chosen.service===undefined||bookingStep===1&&chosen.staff===undefined||bookingStep===2&&!chosen.time){toast('Escolha uma opção para continuar');return}if(bookingStep===2)chosen.date=document.getElementById('date')?.value;if(bookingStep===3){chosen.name=document.getElementById('customerName')?.value;chosen.phone=document.getElementById('customerPhone')?.value;if(!chosen.name||!chosen.phone){toast('Informe nome e WhatsApp fictícios');return}}bookingStep=Math.min(5,bookingStep+1);render();return}if(a==='backbooking'){bookingStep=Math.max(0,bookingStep-1);render();return}if(a==='resetbooking'){bookingStep=0;chosen={};render();return}if(a==='savebrand'){state.tenant=document.getElementById('tenantName').value||state.tenant;state.primary=document.getElementById('tenantPrimary').value;state.secondary=document.getElementById('tenantSecondary').value;render();toast('Identidade aplicada apenas nesta sessão');return}if(a==='confirmbooking'){let name=document.getElementById('newName').value||'Cliente fictício';state.bookings.push({client:name,service:state.services[0].name,staff:state.staff[0],time:document.getElementById('newTime').value||'10:00',status:'Pendente'});modal='';nav('reservas');toast('Agendamento fictício incluído');return}if(a==='confirmservice'){let s={name:document.getElementById('serviceName').value||'Novo serviço',duration:Number(document.getElementById('serviceDuration').value)||45,price:Number(document.getElementById('servicePrice').value)||50};let i=Number(modal.split(':')[1]);if(modal.startsWith('service:'))state.services[i]=s;else state.services.push(s);modal='';nav('servicos');toast('Serviço fictício atualizado');return}if(a==='confirmclient'){state.clients.push({name:document.getElementById('clientName').value||'Cliente exemplo',phone:document.getElementById('clientPhone').value||'(11) 90000-0000',visits:0});modal='';nav('clientes');toast('Cliente fictício incluído');return}if(a==='confirmstaff'){state.staff.push(document.getElementById('staffName').value||'Profissional exemplo');modal='';nav('profissionais');toast('Profissional fictício incluído');return}if(a.startsWith('togglebooking:')){let b=state.bookings[Number(a.split(':')[1])];b.status=b.status==='Confirmado'?'Cancelado':'Confirmado';render();toast('Status fictício alterado');return}if(a==='publico'){bookingStep=0;chosen={};nav('publico');return}if(a==='managebooking'){modal='managebooking';render();return}if(a==='fake'){toast('Ação demonstrativa; sem serviço externo');return}modal=a;render()});const demoRole=new URLSearchParams(location.search).get('perfil')||'admin';const initialPage=demoRole==='cliente'?'publico':demoRole==='profissional'?'profissional':'dashboard';if(demoRole==='cliente'||demoRole==='profissional'){MENU=MENU.filter(x=>x[2]===initialPage);document.body.classList.add('role-compact')}page=initialPage;window.addEventListener('hashchange',()=>{let p=location.hash.slice(1);if(MENU.some(x=>x[2]===p))nav(p)});render();
</script><a class="demo-home-link" href="index.html">← Home original</a></body></html>
