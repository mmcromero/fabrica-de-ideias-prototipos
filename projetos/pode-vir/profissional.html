<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ateliê Aurora — Área profissional (protótipo)</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f5fb;color:#24183e}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}aside{background:#fff;border-right:1px solid #e9e3f1;padding:26px 17px;display:flex;flex-direction:column;gap:6px}.brand{display:flex;gap:12px;align-items:center;margin-bottom:28px;font-weight:850;font-size:19px}.symbol{background:#6b21c9;color:#fff;border-radius:13px;width:42px;height:42px;display:grid;place-items:center;font-size:22px}.small{font-size:12px;color:#80778c}.nav{width:100%;text-align:left;padding:14px;border:0;border-radius:11px;background:transparent;color:#4c405e;font-weight:650}.nav.active{background:#eee4ff;color:#5b21b6}.sidebar-bottom{margin-top:auto;padding:15px;background:#f6f1fc;border-radius:12px;font-size:13px}main{padding:30px;max-width:1150px;width:100%;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:28px}.head h1{font-size:30px;margin:0 0 6px;letter-spacing:-1px}.head p{margin:0;color:#81778d}.avatar{width:44px;height:44px;border-radius:50%;background:#dfcbfb;color:#4d178f;display:grid;place-items:center;font-weight:850}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}.card,.panel{background:#fff;border:1px solid #eee7f4;border-radius:18px;padding:22px;box-shadow:0 6px 25px #25104208}.metric{font-size:32px;font-weight:850;margin:8px 0}.tag{display:inline-block;padding:5px 10px;border-radius:99px;background:#eee6fa;color:#5a21a7;font-size:12px;font-weight:750}.tag.ok{background:#dff7eb;color:#13663e}.tag.warn{background:#fff1d7;color:#94600e}.tag.miss{background:#ffe4e5;color:#9c2437}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.btn{border:0;background:#6525c1;color:#fff;border-radius:10px;padding:11px 15px;font-weight:750}.btn.secondary{background:#f0e7fc;color:#5720a4}.btn.outline{background:#fff;border:1px solid #d8c8ec;color:#5b21b6}.btn.danger{background:#ffe5e7;color:#a5243c}.btn.smallbtn{font-size:12px;padding:8px 11px}.stack{display:grid;gap:12px}.appt{display:grid;grid-template-columns:65px 1fr auto;gap:14px;align-items:center;border:1px solid #ede6f3;border-radius:14px;padding:15px}.appt h3{margin:0 0 4px;font-size:16px}.appt p{margin:0;color:#82778c;font-size:13px}.time{font-size:19px;font-weight:850;color:#5922ae}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.toolbar select,.field{padding:11px 12px;border:1px solid #dcd2e8;border-radius:10px;background:white;width:100%}.toolbar select{width:auto}.panel h2{margin:0 0 16px;font-size:20px}.empty{padding:30px;text-align:center;color:#756b83}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.formgrid label{display:grid;gap:7px;font-size:13px;font-weight:700}.formgrid label.wide{grid-column:1/-1}.notice{padding:13px 16px;background:#fff4da;border:1px solid #f5dfaa;border-radius:11px;font-size:13px;color:#775518;margin:16px 0}.success{background:#e2f7ec;color:#196544;border-color:#b8e9d0}.modal{position:fixed;inset:0;background:#201334b9;display:none;align-items:center;justify-content:center;padding:15px;z-index:5}.modal.open{display:flex}.dialog{background:#fff;border-radius:20px;padding:24px;width:min(100%,530px);max-height:92vh;overflow:auto}.dialog h2{margin:0}.dialog .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.hidden{display:none!important}.mobile{display:none}a{color:#6322bb}textarea{resize:vertical}@media(max-width:800px){.layout{display:block}aside{position:sticky;top:0;z-index:3;padding:10px 15px;display:block;border-right:0;border-bottom:1px solid #e7dff0}.brand{margin:0}.brand .small,.sidebar-bottom{display:none}.desktopnav{display:none}.mobile{display:flex;gap:5px;overflow-x:auto;padding-top:10px}.mobile .nav{white-space:nowrap;padding:9px 12px;font-size:12px}main{padding:20px 14px}.cards{grid-template-columns:repeat(3,1fr);gap:8px}.card{padding:13px}.metric{font-size:23px}.appt{grid-template-columns:55px 1fr;gap:8px}.appt button{grid-column:2;justify-self:start}.formgrid{grid-template-columns:1fr}.head h1{font-size:25px}}</style></head><body>
<div class="layout"><aside><div class="brand"><div class="symbol">✦</div><div>Ateliê Aurora<div class="small">Área da profissional</div></div></div><div class="desktopnav" id="desktop-nav"></div><div class="mobile" id="mobile-nav"></div><div class="sidebar-bottom">👩🏻‍💼 <strong>Camila Santos</strong><br><span class="small">Profissional · Unidade Centro</span></div></aside>
<main><header><div class="head"><h1 id="title">Minha agenda</h1><p id="subtitle">Seus atendimentos em um só lugar</p></div><div class="avatar" title="Camila Santos">CS</div></header><div id="view"></div></main></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog"><div class="row"><h2 id="dialog-title">Atendimento</h2><button class="btn outline smallbtn" id="close">Fechar ✕</button></div><div id="dialog-body"></div></div></div>
<script>
const KEY='podevir-profissional-demo-v1';const initial=[{id:1,time:'09:00',name:'João Almeida',service:'Corte masculino',minutes:45,phone:'(11) 99999-1111',status:'confirmado',notes:'Prefere máquina nas laterais'},{id:2,time:'10:30',name:'Marina Costa',service:'Escova',minutes:60,phone:'(11) 99999-2222',status:'confirmado',notes:''},{id:3,time:'14:00',name:'Pedro Souza',service:'Barba',minutes:30,phone:'(11) 99999-3333',status:'confirmado',notes:''},{id:4,time:'15:30',name:'Ana Lima',service:'Corte feminino',minutes:60,phone:'(11) 99999-4444',status:'cancelado',notes:''}];let data;try{data=JSON.parse(localStorage.getItem(KEY))||null}catch(e){}if(!data||!Array.isArray(data.appointments))data={appointments:structuredClone(initial),blocks:[],available:true};let selected=null;const pages=[['agenda','📅 Minha agenda'],['bloqueios','⛔ Bloqueios'],['disponibilidade','🕒 Disponibilidade'],['perfil','👤 Meu perfil']];const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(data))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const labels={confirmado:'Confirmado',em_atendimento:'Em atendimento',concluido:'Concluído',faltou:'Não compareceu',cancelado:'Cancelado'};const cls={confirmado:'',em_atendimento:'warn',concluido:'ok',faltou:'miss',cancelado:'miss'};function status(s){return '<span class="tag '+(cls[s]||'')+'">'+(labels[s]||s)+'</span>'}function route(){return ['agenda','bloqueios','disponibilidade','perfil'].includes(location.hash.slice(1))?location.hash.slice(1):'agenda'}function nav(){for(const id of ['desktop-nav','mobile-nav'])$(id).innerHTML=pages.map(([key,label])=>'<button class="nav '+(route()===key?'active':'')+'" data-route="'+key+'">'+label+'</button>').join('');document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>location.hash=b.dataset.route)}
function render(){const page=route();nav();const names={agenda:['Minha agenda','Acompanhe seus atendimentos'],bloqueios:['Bloqueios','Reserve períodos sem atendimento'],disponibilidade:['Disponibilidade','Defina se está disponível para receber novos horários'],perfil:['Meu perfil','Dados exibidos na sua área profissional']};$('title').textContent=names[page][0];$('subtitle').textContent=names[page][1];if(page==='agenda')agenda();if(page==='bloqueios')blocks();if(page==='disponibilidade')availability();if(page==='perfil')profile()}
function agenda(){const count=s=>data.appointments.filter(a=>a.status===s).length;let list=data.appointments.filter(a=>a.status!=='cancelado'||$('show-cancelled')?.checked).sort((a,b)=>a.time.localeCompare(b.time));$('view').innerHTML='<div class="notice">Protótipo com dados fictícios. As mudanças ficam somente neste navegador; não há servidor nem envio de mensagens.</div><div class="cards"><div class="card"><div class="small">Confirmados</div><div class="metric">'+count('confirmado')+'</div></div><div class="card"><div class="small">Em andamento</div><div class="metric">'+count('em_atendimento')+'</div></div><div class="card"><div class="small">Concluídos</div><div class="metric">'+count('concluido')+'</div></div></div><div class="panel"><div class="row"><h2>Atendimentos de demonstração</h2><button class="btn outline smallbtn" id="reset">Restaurar dados</button></div><div class="toolbar"><label><input type="checkbox" id="show-cancelled"> Mostrar cancelados</label><span class="small">Os horários são fictícios, não correspondem ao dia atual.</span></div><div class="stack" id="list"></div></div>';function draw(){const show=$('show-cancelled').checked;list=data.appointments.filter(a=>show||a.status!=='cancelado').sort((a,b)=>a.time.localeCompare(b.time));$('list').innerHTML=list.length?list.map(a=>'<article class="appt"><div class="time">'+esc(a.time)+'</div><div><h3>'+esc(a.name)+'</h3><p>'+esc(a.service)+' · '+a.minutes+' min</p>'+status(a.status)+'</div><button class="btn secondary smallbtn" data-id="'+a.id+'">Ver detalhes</button></article>').join(''):'<div class="empty">Nenhum atendimento neste filtro.</div>';$('list').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>detail(Number(b.dataset.id)))}$('show-cancelled').onchange=draw;$('reset').onclick=()=>{if(confirm('Restaurar todos os dados fictícios deste protótipo?')){data={appointments:structuredClone(initial),blocks:[],available:true};save();render()}};draw()}
function detail(id){const a=data.appointments.find(x=>x.id===id);if(!a)return;selected=id;$('dialog-title').textContent=a.name;$('dialog-body').innerHTML='<p>'+status(a.status)+'</p><p><strong>Horário:</strong> '+esc(a.time)+' · '+a.minutes+' minutos</p><p><strong>Serviço:</strong> '+esc(a.service)+'</p><p><strong>Contato:</strong> '+esc(a.phone)+'</p><p><strong>Observações:</strong> '+esc(a.notes||'Nenhuma')+'</p><div class="actions" id="detail-actions"></div>';const actions=[['confirmado','em_atendimento','Iniciar atendimento'],['em_atendimento','concluido','Concluir atendimento'],['confirmado','faltou','Marcar falta'],['confirmado','cancelado','Cancelar atendimento']];$('detail-actions').innerHTML=actions.filter(x=>x[0]===a.status).map(x=>'<button class="btn '+(x[1]==='cancelado'?'danger':'secondary')+'" data-status="'+x[1]+'">'+x[2]+'</button>').join('')+(a.status==='confirmado'?'<button class="btn outline" id="reschedule">Remarcar</button>':'')||'<p class="small">Este atendimento não tem novas ações neste protótipo.</p>';const rb=$('reschedule');if(rb)rb.onclick=()=>reschedule(a.id);$('detail-actions').querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{const next=b.dataset.status;if((next==='cancelado'||next==='faltou')&&!confirm('Confirma a mudança de estado para '+labels[next]+'?'))return;a.status=next;save();$('modal').classList.remove('open');render()});$('modal').classList.add('open')}
function reschedule(id){const a=data.appointments.find(x=>x.id===id);if(!a)return;$('dialog-title').textContent='Remarcar · '+a.name;$('dialog-body').innerHTML='<p class="small">Horário atual: '+esc(a.time)+'. Este teste não consulta um servidor nem valida a disponibilidade de outros profissionais.</p><form id="reschedule-form" class="formgrid"><label>Novo horário<input class="field" type="time" name="time" required value="'+esc(a.time)+'"></label><label class="wide">Motivo (opcional)<textarea class="field" name="reason" rows="2" placeholder="Ex.: pedido do cliente"></textarea></label><div><button class="btn" type="submit">Confirmar remarcação</button></div><div><button class="btn outline" type="button" id="back-detail">Voltar</button></div></form><p class="notice">A remarcação só muda a hora fictícia neste navegador. Não envia avisos ao cliente.</p>';$('back-detail').onclick=()=>detail(id);$('reschedule-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const t=f.get('time');if(!t)return;const end=t.split(':').map(Number).reduce((h,m)=>h*60+m,0)+a.minutes;const conflict=data.appointments.some(x=>x.id!==a.id&&!['cancelado','faltou'].includes(x.status)&&(()=>{const st=x.time.split(':').map(Number).reduce((h,m)=>h*60+m,0);return t.split(':').map(Number).reduce((h,m)=>h*60+m,0)<st+x.minutes&&end>st})());if(conflict)return alert('Conflito: já existe outro atendimento fictício neste horário.');a.time=t;save();$('modal').classList.remove('open');render()}} 
function blocks(){$('view').innerHTML='<div class="panel"><h2>Novo bloqueio</h2><p class="small">Use para almoço, folga ou compromisso pessoal. Neste protótipo, o bloqueio não recalcula agendamentos existentes.</p><form id="block-form" class="formgrid"><label>Data<input class="field" type="date" name="date" required></label><label>Motivo<select class="field" name="reason"><option>Compromisso pessoal</option><option>Almoço</option><option>Folga</option><option>Outro</option></select></label><label>Início<input class="field" type="time" name="start" required></label><label>Fim<input class="field" type="time" name="end" required></label><div><button class="btn" type="submit">Salvar bloqueio</button></div></form></div><div class="panel" style="margin-top:18px"><h2>Bloqueios cadastrados</h2><div id="blocks-list" class="stack"></div></div>';$('block-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(f.get('end')<=f.get('start'))return alert('O fim deve ser depois do início.');data.blocks.push({id:Date.now(),date:f.get('date'),reason:f.get('reason'),start:f.get('start'),end:f.get('end')});save();blocks()};$('blocks-list').innerHTML=data.blocks.length?data.blocks.map(b=>'<div class="slot row"><div><strong>'+esc(b.date)+' · '+esc(b.start)+'–'+esc(b.end)+'</strong><div class="small">'+esc(b.reason)+'</div></div><button class="btn danger smallbtn" data-block="'+b.id+'">Excluir</button></div>').join(''):'<div class="empty">Nenhum bloqueio cadastrado.</div>';$('blocks-list').querySelectorAll('[data-block]').forEach(b=>b.onclick=()=>{if(confirm('Excluir este bloqueio?')){data.blocks=data.blocks.filter(x=>x.id!==Number(b.dataset.block));save();blocks()}})}
function availability(){$('view').innerHTML='<div class="panel"><h2>Receber novos agendamentos</h2><p>Estado demonstrativo: <strong>'+(data.available?'Disponível':'Indisponível')+'</strong></p><p class="small">Este controle simula uma preferência. Não altera reservas nem disponibilidades em um servidor.</p><button class="btn '+(data.available?'danger':'')+'" id="toggle">'+(data.available?'Pausar novos agendamentos':'Voltar a receber agendamentos')+'</button></div>';$('toggle').onclick=()=>{data.available=!data.available;save();availability()}}
function profile(){$('view').innerHTML='<div class="panel"><h2>Camila Santos</h2><p><strong>Estabelecimento:</strong> Ateliê Aurora</p><p><strong>Função:</strong> Profissional</p><p><strong>Serviços:</strong> Corte, escova e barba (exemplo)</p><p class="notice">A identidade visual exibida pertence ao estabelecimento fictício, não à plataforma Pode Vir. Alterações de perfil, permissões e login real ainda não foram implementadas.</p></div>'}
$('close').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').classList.remove('open')});window.addEventListener('hashchange',render);render();
</script></body></html>
