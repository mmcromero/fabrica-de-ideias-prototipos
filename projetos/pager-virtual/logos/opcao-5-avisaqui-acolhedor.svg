<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="avisaSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="warmAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <rect id="background" width="100%" height="100%" rx="24" fill="#0B1120"/>

  <!-- SÍMBOLO: Sino de Notificação + Arco de Acolhimento & Sinal Aberto -->
  <g transform="translate(65, 35)">
    <!-- Cúpula de Sino / Balão de Aviso amigável -->
    <path d="M 85 30 C 58 30, 48 55, 46 88 C 42 98, 32 108, 30 114 C 28 120, 34 124, 44 124 H 126 C 136 124, 142 120, 140 114 C 138 108, 128 98, 124 88 C 122 55, 112 30, 85 30 Z" fill="url(#warmAmber)"/>
    
    <!-- Pêndulo / Luz de "Pronto" -->
    <circle cx="85" cy="136" r="12" fill="#34D399"/>
    
    <!-- Ondas concêntricas de chamada rápida -->
    <path d="M 60 18 A 30 30 0 0 1 110 18" fill="none" stroke="#34D399" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 46 4 A 46 46 0 0 1 124 4" fill="none" stroke="#FBBF24" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- TIPOGRAFIA: Avisaqui + Tagline -->
  <g transform="translate(255, 115)">
