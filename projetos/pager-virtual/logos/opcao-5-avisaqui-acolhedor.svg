    </text>

    <text y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="18" letter-spacing="0.5px" fill="#94A3B8">
      O AVISO QUE CHEGA NA HORA <tspan fill="#FBBF24">·</tspan> DOMÍNIO .COM.BR 100% LIVRE
    </text>

    <!-- Badges -->
    <rect x="0" y="58" width="190" height="24" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="12" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11.5" fill="#34D399">
      🌐 AVISAQUI.COM.BR LIVRE
    </text>

    <rect x="200" y="58" width="165" height="24" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="212" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11.5" fill="#38BDF8">
      📱 ZERO INSTALAÇÃO
