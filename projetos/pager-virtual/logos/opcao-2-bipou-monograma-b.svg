<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FF3D00"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="bShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fundo Sólido (Remova ou troque para transparent) -->
  <rect id="background" width="100%" height="100%" rx="24" fill="#0B1120"/>

  <!-- SÍMBOLO: Monograma 'B' com Círculos Concêntricos de Pager Digital -->
  <g transform="translate(60, 35)" filter="url(#bShadow)">
    <!-- Disco Base (O Pager Desmaterializado) -->
    <circle cx="85" cy="85" r="75" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    
    <!-- Anel de Transmissão de Sinal (Onda Contínua) -->
    <circle cx="85" cy="85" r="62" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="4 6" opacity="0.6"/>

    <!-- Forma do 'B' esculpida com Arcos e Círculos -->
    <!-- Coluna vertical do B -->
    <rect x="52" y="38" width="18" height="94" rx="9" fill="url(#bGrad)"/>
    
    <!-- Alça Superior do B -->
    <path d="M 64 38 H 94 C 112 38, 126 50, 126 66 C 126 82, 112 90, 94 90 H 64 Z" fill="url(#bGrad)"/>
    <circle cx="88" cy="64" r="10" fill="#0B1120"/>

    <!-- Alça Inferior do B (Expande como onda sonora / bocada) -->
    <path d="M 64 82 H 98 C 118 82, 134 96, 134 114 C 134 132, 118 132, 98 132 H 64 Z" fill="url(#bGrad)"/>
    <circle cx="92" cy="107" r="11" fill="#0B1120"/>

    <!-- Ponto do Alarme / Luz Piloto de "Pronto" -->
    <circle cx="128" cy="46" r="9" fill="url(#ringGrad)"/>
    <circle cx="128" cy="46" r="4" fill="#FFFFFF"/>
  </g>

  <!-- TIPOGRAFIA: Bipou! + Tagline -->
  <g transform="translate(255, 115)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="74" letter-spacing="-2px" fill="#FFFFFF">
      BIPOU<tspan fill="#FF7A00">.</tspan><tspan fill="#34D399">IO</tspan>
    </text>

    <text y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="19" letter-spacing="0.5px" fill="#94A3B8">
      SEU PEDIDO PRONTO <tspan fill="#FF7A00">·</tspan> ZERO FILAS NO BALCÃO
    </text>

    <!-- Badges de Vantagem -->
    <rect x="0" y="58" width="185" height="24" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="12" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11.5" fill="#FBBF24">
      ⚡ ACIONAMENTO VIA QR
    </text>

    <rect x="195" y="58" width="160" height="24" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="207" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11.5" fill="#34D399">
      📱 100% NO NAVEGADOR
    </text>
  </g>
</svg>