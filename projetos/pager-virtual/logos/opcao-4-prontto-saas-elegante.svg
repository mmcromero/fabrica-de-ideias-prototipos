<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="pBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <rect id="background" width="100%" height="100%" rx="24" fill="#0B1120"/>

  <!-- SÍMBOLO: Monograma P + Check de 'Pronto' + Pulso de Tempo -->
  <g transform="translate(65, 38)">
    <!-- Círculo externo de precisão / radar -->
    <circle cx="85" cy="82" r="72" fill="none" stroke="#1E293B" stroke-width="4"/>
    <circle cx="85" cy="82" r="72" fill="none" stroke="url(#pGrad)" stroke-width="4" stroke-dasharray="140 320" stroke-linecap="round"/>

    <!-- Forma do 'P' estilizada -->
    <rect x="52" y="42" width="18" height="82" rx="9" fill="#F8FAFC"/>
    
    <!-- Cabeça do P com Checkmark embutido -->
    <path d="M 66 42 H 98 C 118 42, 134 56, 134 76 C 134 96, 118 110, 98 110 H 66 Z" fill="url(#pGrad)"/>
    
    <!-- Checkmark interno (Pronto para retirada) -->
    <path d="M 84 76 L 94 86 L 114 62" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- TIPOGRAFIA: Prontto + Tagline -->
  <g transform="translate(255, 115)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="74" letter-spacing="-1.5px" fill="#FFFFFF">
      PRONTTO<tspan fill="#34D399">.</tspan>
    </text>

    <text y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="19" letter-spacing="0.5px" fill="#94A3B8">
      PAGER DIGITAL INTELIGENTE <tspan fill="#38BDF8">·</tspan> ZERO PERDAS &amp; AVARIAS
    </text>

    <!-- Badges B2B -->
    <rect x="0" y="58" width="195" height="24" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="12" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11.5" fill="#38BDF8">
      💼 ECONOMIA B2B IMEDIATA
    </text>

    <rect x="205" y="58" width="165" height="24" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="217" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11.5" fill="#34D399">
      ⚡ PLUG &amp; PLAY NO CAIXA
    </text>
  </g>
</svg>