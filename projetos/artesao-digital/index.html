<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Artesão Digital</title>
<style>
:root {
 color-scheme: light; --green:#126638; --deep:#113823; --ink:#162b20; --muted:#50645a;
 --surface:#fff; --background:#f3f7f3; --tint:#e6f3e9; --line:#cfdfd2; --danger:#a5222d;
 --radius:13px; --gap:10px; --width:min(100vw,480px); font:16px/1.42 system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:#dfece2;color:var(--ink)}
button,input,select,textarea{font:inherit}
button{min-height:44px;padding:8px 12px;border:1px solid #9fbaa6;border-radius:10px;background:var(--surface);color:var(--deep);font-weight:690;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--green);border-color:var(--green);color:#fff}
button.ghost{border-color:transparent;background:transparent}
button.danger{background:#fff5f5;border-color:#e3b8bd;color:var(--danger)}
button[aria-pressed="true"]{background:var(--tint);border-color:#71a282;color:#174f2e}
:focus-visible{outline:3px solid #43875b;outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
h1{font-size:22px;line-height:1.2}
h2{font-size:17px}
h3{font-size:15px;line-height:1.25}
small,.muted{color:var(--muted);font-size:13px}
label{display:grid;gap:5px;font-size:13px;font-weight:650}
input,select{width:100%;min-width:0;min-height:44px;padding:8px 10px;border:1px solid #9eb3a3;border-radius:10px;background:var(--surface);color:var(--ink);font-size:16px}
input[type=checkbox]{width:18px;min-height:18px;margin:0;accent-color:var(--green)}
.app{width:var(--width);height:100dvh;margin:auto;background:var(--background);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 28px #254e3126}
.top{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:6px;background:var(--deep);color:#fff;padding:7px 10px}
.top button{color:#fff;background:transparent;border:0;font-size:22px;padding:0}
.brand{text-align:center;font-weight:760;line-height:1.2}
.brand small{display:block;color:#d3ecd9;font-size:11px;margin-top:3px}
.session-line{padding:5px 12px;color:#305a40;background:var(--tint);border-bottom:1px solid var(--line);font-size:12px;font-weight:650;text-align:center;overflow-wrap:anywhere}
.session-line:empty{display:none}
main{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:15px 13px}
footer{background:var(--surface);border-top:1px solid var(--line);padding:9px 13px max(10px,env(safe-area-inset-bottom));box-shadow:0 -4px 14px #21442b10}
footer:empty{display:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.row>*{min-width:0}
.stack{display:grid;gap:var(--gap)}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:11px;overflow-wrap:anywhere}
.rule{border-top:1px solid var(--line);padding-top:7px}
.total{background:var(--tint);color:#164e2e;border-radius:9px;padding:8px 9px;font-weight:750}
.big{font-size:21px;letter-spacing:-.025em}
.pill{display:inline-block;font-size:11px;line-height:1.35;font-weight:650;background:var(--tint);color:#245338;border-radius:8px;padding:2px 5px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{font-size:12px;padding:5px 8px;min-height:36px}
.search{position:relative}
.search span{position:absolute;left:10px;top:12px;color:var(--green);pointer-events:none}
.search input{padding-left:33px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.product{display:flex;flex-direction:column;gap:5px;padding:7px;min-width:0}
.photo{display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:9px;background-color:#e4efe5;background-image:var(--product-photos,linear-gradient(145deg,#f1f7f1,#d5e8d8));background-position:var(--photo-position,0% 0%);background-size:300% 200%}
.photo[data-photo="p2"]{--photo-position:50% 0%}.photo[data-photo="p3"]{--photo-position:100% 0%}
.photo[data-photo="p4"]{--photo-position:0% 100%}.photo[data-photo="p5"]{--photo-position:50% 100%}.photo[data-photo="p6"]{--photo-position:100% 100%}
.photo-placeholder{background:var(--tint);color:#305a40}
.photo-placeholder .icon{width:52%;height:52%}
.icon{display:inline-block;width:19px;height:19px;vertical-align:-.2em;flex:none}
.icon + span{margin-left:6px}
.screen-title{display:flex;align-items:center;gap:8px}
.screen-title>.icon{width:23px;height:23px;color:var(--green)}
.choice-group{display:grid;gap:5px;grid-template-columns:repeat(var(--choices,2),minmax(0,1fr))}
.choice-group button{font-size:13px;padding-inline:5px;overflow-wrap:anywhere}
.choice-group[data-group="item-tier"]{grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.35fr)}
.choice-group[data-group="item-tier"] button{font-size:12px;padding-inline:3px}
.item-preview{display:grid;grid-template-columns:96px minmax(0,1fr);gap:11px;align-items:center}
.item-preview h3{font-size:16px}
.item-original{display:grid;gap:2px;margin-top:4px}
.edit-item-footer{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding-top:4px}
.edit-item-footer button{font-size:14px;padding-inline:7px}
.checkout-methods button{display:flex;align-items:center;gap:8px;text-align:left}
.checkout-methods button .method-state{margin-left:auto;width:15px;height:15px;border-radius:50%;border:1px solid #6d9478}
.checkout-methods button[aria-pressed="true"] .method-state{border:4px solid var(--green)}
.payment-total{text-align:center;background:var(--tint)}
.payment-total strong{display:block;font-size:28px;letter-spacing:-.035em;color:var(--green)}
.entry-intro{display:grid;grid-template-columns:48px minmax(0,1fr);align-items:center;gap:10px}
.entry-intro .entry-icon{height:48px;border-radius:11px;background:var(--tint);color:var(--green);display:grid;place-items:center}
.filter-state{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px}
.filter-state button{font-size:12px;min-height:36px}
.product-line{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center}
.product-line .photo{width:44px;border-radius:8px}
.product-line h3{overflow-wrap:anywhere}
.product-line small{display:block}
.product-line .amount{font-size:13px}
.product-line .subline{grid-column:2/-1}
.cart-item .row{flex-wrap:wrap}
.event-bar{display:grid;gap:3px;background:var(--tint);padding:4px 12px;border-bottom:1px solid var(--line)}
.event-bar:empty{display:none}
.event-bar.compact{grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px}
.event-bar .session-line{background:transparent;border:0;padding:0;text-align:left;min-width:0}
.visitors{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.visitors button{font-size:12px;min-height:44px;padding:4px 7px;white-space:nowrap}
.demo-status:empty{display:none}
.demo-status{padding:3px 12px;background:#fff3db;color:#654008;font-size:12px;font-weight:650}
.demo-status button{min-height:36px;font-size:12px;padding:3px 7px}
.evaluation{border-left:3px solid #72a382;padding-left:8px}
.deficit{background:#fce9e9;color:#8f2830}
.status-message{padding:5px 12px;background:var(--tint);border-bottom:1px solid var(--line);color:var(--deep);font-size:13px}
.status-message:empty{display:none}
details.stack[open]>:not(summary){margin-top:8px}
.product h3{font-size:14px}
.product .row{margin-top:auto}
.product button{min-width:44px;padding:2px 9px;font-size:20px}
.origin{display:flex;flex-wrap:wrap;gap:3px}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:44px;padding:0}
.qty span{min-width:18px;text-align:center}
.amount{white-space:nowrap;font-variant-numeric:tabular-nums}
.check{display:flex;align-items:center;gap:8px;font-weight:550}
.notice{padding:8px 10px;border-radius:9px;background:#fff3db;color:#654008;font-size:13px}
.full{width:100%}
.success{text-align:center;padding:8px 0}
.success strong{display:grid;place-items:center;margin:0 auto 8px;width:55px;height:55px;border-radius:50%;background:var(--green);color:#fff;font-size:28px}
dialog{position:fixed;inset:auto 0 0;width:var(--width);max-width:none;max-height:88dvh;margin:0 auto;padding:13px;border:1px solid var(--line);border-radius:20px 20px 0 0;background:var(--background);color:var(--ink);overscroll-behavior:contain}
dialog::backdrop{background:#102418ad}
dialog header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
dialog header button{width:44px;padding:0;font-size:20px}
dialog output{display:block}
details summary{cursor:pointer;font-weight:650}
details p{margin-top:6px}
.qr{margin:0 auto;text-align:center}
.qr svg{display:block;width:132px;height:132px;margin:0 auto;border-radius:8px;background:#fff;shape-rendering:crispEdges}
.receipt{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.5 ui-monospace,monospace;margin:0}

/* PAIR-PROT-001 — tela inicial mobile-first */
.entry-heading{display:grid;gap:7px;margin:3px 0 8px}.entry-heading .screen-title{font-size:23px;color:var(--deep)}
.entry-actions{display:grid;gap:10px}
.entry-action{display:flex;align-items:center;gap:13px;width:100%;min-height:78px;padding:14px;text-align:left;border-radius:13px;border:1px solid var(--line);background:var(--surface);box-shadow:0 2px 8px #21442b0b}
.entry-action.featured{background:var(--deep);color:white;border-color:var(--deep)}
.entry-action.soft{background:var(--tint);border-color:#b9d5bf}
.entry-action.disabled-action{background:#f6f7f6;color:#647268;opacity:1;border-style:dashed}
.entry-action-icon{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;background:#ffffff24;flex-shrink:0}
.entry-action.soft .entry-action-icon,.entry-action.disabled-action .entry-action-icon{background:#e0ece3}
.entry-action-icon .icon{width:23px;height:23px}
.entry-action-copy{display:grid;gap:5px;min-width:0;flex:1}
.entry-action-copy strong{font-size:16px}.entry-action-copy small{color:inherit;font-size:12px;font-weight:450;opacity:.82;line-height:1.35}
.entry-chevron{font-size:28px;font-weight:400;opacity:.7}
.entry-history{display:grid;gap:9px;margin-top:14px}.entry-history h2{font-size:17px;color:var(--deep)}
.entry-recent-list{display:grid;gap:8px}
.recent-event{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:66px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.recent-event>span:first-child{display:grid;gap:5px;min-width:0}.recent-event small{font-size:12px;font-weight:450}
.event-badge{display:inline-block;border-radius:20px;padding:5px 8px;font-size:11px;font-weight:750;white-space:nowrap;background:#ecefee;color:#59625e}
.event-badge.open{background:#ddf2e3;color:#17643b}
.top .brand strong{font-size:15px;letter-spacing:-.02em}

/* PAIR-PROT-001: cabeçalho único, referência visual aprovada, largura adaptável. */
.top{grid-template-columns:44px minmax(0,1fr) auto;min-height:76px;position:relative;padding:8px 12px;background:var(--deep);gap:8px}
.top button{font-size:14px}
.top .header-menu{display:grid;place-items:center;width:44px;height:46px}
.brand{display:flex;justify-self:center;justify-content:center;align-items:center;min-width:0;height:64px;line-height:1}
.brand img{max-height:62px;max-width:85px;width:auto;height:auto;object-fit:contain}
.header-actions{display:flex;align-items:center;justify-content:flex-end;gap:2px;justify-self:end}
.header-action{display:grid;align-content:center;justify-items:center;gap:2px;min-width:43px;min-height:50px;border:0!important;border-radius:8px!important;padding:4px 3px!important;line-height:1}
.header-action .icon{width:20px;height:20px}
.header-action small{display:block;font-size:10px;font-weight:550;color:inherit;line-height:1.2}
.header-separator{width:1px;height:32px;background:#ffffff66;margin:0 3px}
.bottom-nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:stretch;gap:5px;padding:7px 12px max(9px,env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.bottom-nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:57px;padding:6px 4px;border:0;border-radius:10px;background:transparent;color:#45554c}
.bottom-nav .icon{width:23px;height:23px}.bottom-nav small{font-size:12px;color:inherit;font-weight:600}
.bottom-nav button[aria-current="page"]{background:var(--green);color:white}
.entry-heading{margin-bottom:7px}.entry-heading .screen-title{display:flex;gap:12px;align-items:center;font-size:22px;color:#161d17}
.entry-heading .screen-title .icon{width:33px;height:33px;color:var(--green)}
.entry-heading p{font-size:14px;margin-left:45px;line-height:1.45}
.entry-actions{display:grid;gap:9px}
.entry-action{min-height:82px;padding:15px;display:flex;align-items:center;gap:16px;border:1px solid #c4d4c8;border-radius:17px;text-align:left;box-shadow:0 2px 6px #173f230b}
.entry-action.featured{background:#006b2a;border-color:#006b2a;color:#fff}
.entry-action.secondary{background:white;color:#16281c}
.entry-action.soft{background:#e4f2e8;border-color:#e4f2e8;color:#12572e}
.entry-action.disabled-action{opacity:.65;background:#f4f5f4;color:#53675c;border-style:dashed}
.entry-action-icon{display:flex;justify-content:center;align-items:center;width:44px;height:44px;flex-shrink:0;background:transparent!important}
.entry-action-icon .icon{width:33px;height:33px}
.entry-action-copy{display:grid;gap:4px;min-width:0;flex:1}
.entry-action-copy strong{font-size:18px;line-height:1.1}
.entry-action-copy small{font-size:13px;line-height:1.25;color:inherit;opacity:.86}
.entry-chevron{font-size:30px;line-height:1;opacity:.85}
.entry-history{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.entry-history-title h2{display:flex;align-items:center;gap:10px;font-size:19px}
.entry-history-title h2 .icon{color:var(--green);width:24px;height:24px}
.entry-history-title button{color:var(--green);font-weight:750}
.entry-recent-list{display:grid;gap:9px}
.recent-event{min-height:80px;padding:12px;display:flex;gap:11px;border:1px solid #d8ded9;border-radius:15px;align-items:center;background:#fff}
.recent-icon{display:grid;place-items:center;flex-shrink:0;width:52px;height:52px;background:var(--tint);color:var(--green);border-radius:12px}
.recent-icon .icon{width:26px;height:26px}
.recent-event-info{display:grid;gap:6px;flex:1;min-width:0;text-align:left}
.recent-event-info strong{font-size:15px;line-height:1.2}
.recent-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;font-weight:500;color:var(--muted)}
.recent-meta .icon{width:14px;height:14px}
.event-badge{font-size:11px;font-weight:700;border-radius:14px;padding:3px 7px}
.event-badge.open{background:#d9f2e1;color:#17643b}.event-badge.closed{background:#eee;color:#616663}
.entry-empty{padding:14px;border:1px dashed var(--line);border-radius:12px;background:white}
@media(max-width:767px){
  .top .brand{position:absolute;left:50%;transform:translateX(-50%);width:68px;pointer-events:none}
  .top{grid-template-columns:44px 1fr auto}
  .top .header-menu{grid-column:1}
  .top .header-actions{grid-column:3}
  .bottom-nav{width:100%}
  .entry-actions{grid-template-columns:1fr}
}
@media(max-width:370px){
  .top{padding:6px 5px;gap:2px}
  .top .header-menu{width:38px}
  .top .brand img{max-height:49px;max-width:54px}
  .header-action{min-width:39px}
  .header-action small{font-size:9px}
  .header-separator{margin:0 1px}
  .entry-action{padding:12px;gap:10px}
}
@media(min-width:768px){
  :root{--width:100vw}
  .app{max-width:none;box-shadow:none}
  .top{padding:12px clamp(20px,4vw,64px);grid-template-columns:minmax(0,1fr) auto;min-height:90px}
  .top .header-menu{display:none}
  .top .brand{grid-column:1;justify-self:start}
  .top .brand img{max-height:78px;max-width:110px}
  .top .header-actions{grid-column:2;gap:12px}
  .top .header-action{min-width:57px;min-height:58px}
  .top .header-action small{font-size:12px}
  .top .header-action .icon{width:23px;height:23px}
  .top .header-separator{height:39px;margin:0 5px}
  main{width:min(100%,1200px);margin:0 auto;padding:28px clamp(20px,4vw,48px)}
  .entry-heading{margin-bottom:24px}
  .entry-heading .screen-title{font-size:30px}
  .entry-heading p{font-size:16px}
  .entry-actions{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
  .entry-action{min-height:125px;padding:20px}
  .entry-action-copy strong{font-size:20px}
  .entry-action-copy small{font-size:14px}
  .entry-history{margin-top:32px;padding-top:24px}
  .entry-recent-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
  .recent-event{min-height:100px}
  .bottom-nav{display:flex;justify-content:center;gap:14px}
  .bottom-nav button{min-width:135px;min-height:60px}
  footer:not(:empty){padding-inline:max(24px,calc((100vw - 1120px)/2))}
}

/* PAIR-PROT-001: escopo de lançamento e navegação global x navegação do PDV */
:root{--content-limit:1100px}
.top{display:block;padding:0 16px}
.top[hidden],.bottom-nav[hidden],.event-bar[hidden]{display:none!important}
.header-inner{position:relative;width:min(100%,var(--content-limit));margin:0 auto;display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;min-height:84px;gap:10px}
.header-inner .header-menu{display:grid;place-items:center;width:44px;height:50px}
.header-inner .brand{grid-column:2;justify-self:start;position:static;transform:none;width:auto;pointer-events:auto;display:flex}
.header-inner .brand img{max-width:100px;max-height:70px}
.header-inner .header-actions{grid-column:3;justify-self:end;display:flex;align-items:center;gap:5px}
.header-inner .header-separator{height:32px;width:1px;margin:0 5px;background:#ffffff88}
.header-inner .header-action{min-width:52px;min-height:58px}
.header-inner .header-action small{font-size:11px}
.header-inner .header-action .icon{width:21px;height:21px}
.bottom-nav{width:min(100%,var(--content-limit));margin-inline:auto;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;flex-shrink:0}
.bottom-nav button{min-width:0!important}
.login-shell{min-height:calc(100dvh - 80px);display:grid;place-items:center;padding:24px 14px}
.login-card{width:min(100%,400px);background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;display:grid;gap:16px;text-align:center;box-shadow:0 8px 26px #193e2b18}
.login-card h1{font-size:24px}
.login-mark{height:130px;background:var(--deep);border-radius:14px;display:grid;place-items:center}
.login-mark img{width:125px;max-height:116px;object-fit:contain}
@media(max-width:767px){
 .top{padding-inline:7px}
 .header-inner{grid-template-columns:42px minmax(0,1fr) auto;min-height:76px;gap:2px}
 .header-inner .header-menu{grid-column:1;width:40px}
 .header-inner .brand{position:absolute;left:50%;transform:translateX(-50%);grid-column:auto;justify-self:auto;width:64px;pointer-events:none}
 .header-inner .brand img{max-width:64px;max-height:56px}
 .header-inner .header-actions{grid-column:3;gap:1px}
 .header-inner .header-action{min-width:40px;min-height:52px;padding:3px 1px!important}
 .header-inner .header-action small{font-size:9px}
 .header-inner .header-separator{margin:0 2px;height:28px}
 .bottom-nav{width:100%}
 .login-shell{min-height:calc(100dvh - 80px)}
}
@media(max-width:370px){
 .header-inner .brand{left:47%;width:56px}
 .header-inner .brand img{max-width:56px}
 .header-inner .header-action{min-width:37px}
 .header-inner .header-action small{font-size:8px}
 .header-inner .header-separator{margin:0 1px}
}
@media(min-width:768px){
 :root{--width:100vw}
 .app{max-width:none}
 .top{padding:0 clamp(20px,3vw,50px)}
 .header-inner{grid-template-columns:52px minmax(0,1fr) auto;min-height:86px}
 .header-inner .header-menu{display:grid}
 .header-inner .brand{grid-column:2}
 .header-inner .brand img{max-height:74px;max-width:104px}
 .header-inner .header-actions{grid-column:3}
 .bottom-nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:8px 14px}
 .bottom-nav button{min-height:58px}
 main{width:min(100%,var(--content-limit));padding:27px 16px;margin-inline:auto}
 .entry-actions{grid-template-columns:repeat(3,minmax(0,1fr))}
 .entry-recent-list{grid-template-columns:repeat(2,minmax(0,1fr))}
 dialog{width:min(540px,94vw)}
}

/* UX-PRIMEIRO-ACESSO-002 — estados públicos reproduzidos no protótipo */
.top[hidden],#bottom-nav[hidden],#event-bar[hidden],#demo-status[hidden]{display:none!important}
.public-entry{width:100%;max-width:560px;margin:0 auto;display:grid;gap:20px;padding:20px 0 30px;color:#1F2A25;font-family:Inter,Arial,Helvetica,sans-serif}
.public-brand{display:flex;align-items:center;justify-content:center;min-height:150px}
.public-brand img{display:block;max-width:min(240px,70vw);max-height:170px;width:auto;height:auto;object-fit:contain}
.public-card{display:grid;gap:15px;background:#fff;border:1px solid #CBB493;border-radius:16px;padding:28px 28px 30px;box-shadow:0 6px 24px #203a2d0b}
.public-card h1{font-size:30px;font-weight:600;line-height:1.24;outline-offset:5px}
.public-intro{font-size:16px;line-height:1.5}
.public-card button{min-height:48px;font-size:16px;font-weight:600}
.public-card button.primary{background:#1E4D3B;border-color:#1E4D3B}
.public-form{display:grid;gap:14px}
.public-form label,.public-card>label{font-size:14px;font-weight:600;gap:6px}
.public-form input:not([type=checkbox]),.public-card>label input{min-height:48px}
.public-privacy,.public-help{font-size:14px;color:#4D6056;line-height:1.5}
.public-consent{display:flex!important;align-items:flex-start;gap:10px!important;font-weight:450!important;line-height:1.5}
.public-consent input{width:20px;min-width:20px;height:20px;min-height:20px;margin-top:2px}
.public-secondary{background:#F5F5EF;border:1px solid #1E4D3B;color:#1E4D3B}
.public-switch{display:block!important;border:0!important;background:transparent!important;color:#1E4D3B!important;text-decoration:underline;text-underline-offset:4px;text-align:center;font-weight:650!important;padding:9px 8px!important}
.public-google{margin-top:6px}
.public-status:empty{display:none}
.public-status{font-size:14px;color:#1E4D3B}
.public-legal{display:flex;gap:12px 18px;flex-wrap:wrap;justify-content:center;font-size:13px;text-align:center}
.public-legal a{color:#1E4D3B}
.app:has(.public-entry){background:#F5F5EF}
.app:has(.public-entry) main{overflow-y:auto}
@media(max-width:767px){
 .public-entry{padding:10px 2px 28px;gap:10px}
 .public-brand{min-height:112px}
 .public-brand img{max-width:180px;max-height:118px}
 .public-card{padding:20px 16px 22px;gap:13px}
 .public-card h1{font-size:25px}
 .public-legal{padding:10px 4px 0}
}
@media(min-width:768px){.app:has(.public-entry) main{padding-top:24px}}

/* UX-PRIMEIRO-ACESSO-002 — rodapé público único e login Google */
.public-entry{max-width:560px;padding-top:14px;padding-bottom:18px;gap:12px}
.public-brand{min-height:165px;margin-bottom:5px}
.public-brand img{max-width:min(210px,64vw);max-height:158px}
.public-card{position:relative;border:1px solid #d8c5a7;border-radius:18px;padding:30px 32px 32px;box-shadow:0 10px 38px #203a2d13}
.public-card h1{color:#1E4D3B;letter-spacing:-.025em}
.public-card .public-intro{color:#37463e}
.public-card .public-help{margin-top:4px}
.public-card .public-switch{font-size:14px!important;text-decoration:underline}
.public-card .public-secondary{border:1px solid #1E4D3B}
.public-card .google-signin{display:flex;align-items:center;justify-content:center;gap:12px;background:#fff!important;border:1px solid #747775!important;color:#1f1f1f!important;font:600 14px/20px Arial,Helvetica,sans-serif!important;letter-spacing:0;border-radius:7px!important;min-height:48px!important;margin-top:9px}
.public-card .google-signin:hover{background:#f7f8f8!important;box-shadow:0 2px 6px #1112}
.public-card .google-signin img{width:20px;height:20px;object-fit:contain;flex-shrink:0}
.public-card .public-form button.primary:hover{filter:brightness(1.07)}
.public-site-footer{background:#F5F5EF!important;border-top:1px solid #ddc8a6!important;box-shadow:none!important;padding:13px 18px max(16px,env(safe-area-inset-bottom))!important}
.public-footer-nav{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 22px;max-width:1100px;margin:0 auto}
.public-footer-nav a,.public-footer-nav .public-footer-link{font:500 13px/1.4 Arial,Helvetica,sans-serif;color:#1E4D3B;background:transparent;border:0;padding:3px 0;min-height:28px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.public-footer-nav .public-footer-link{font-weight:700;border-left:1px solid #c7b692;padding-left:20px;border-radius:0}
.public-footer-nav a:focus-visible,.public-footer-nav button:focus-visible{outline:2px solid #1E4D3B;outline-offset:4px}
.admin-overview{display:grid;gap:6px;padding:16px;border:1px solid #d8c5a7;border-radius:12px;background:#F5F5EF}
.admin-overview h2{font-size:16px;margin-top:6px;color:#1E4D3B}
.admin-overview p{font-size:14px;color:#586259}
@media(max-width:767px){
 .public-entry{padding-top:8px;padding-bottom:12px;gap:7px}
 .public-brand{min-height:122px;margin-bottom:1px}
 .public-brand img{max-width:160px;max-height:112px}
 .public-card{padding:22px 18px 24px}
 .public-site-footer{padding:11px 12px max(12px,env(safe-area-inset-bottom))!important}
 .public-footer-nav{gap:5px 13px}
 .public-footer-nav a,.public-footer-nav .public-footer-link{font-size:12px}
 .public-footer-nav .public-footer-link{border-left:0;padding-left:0}
}


/* Inscrição: hierarquia informativa com texto legal preservado e contraste AA. */
.signup-note{
 min-width:0;display:grid;gap:8px;
 padding:14px 16px;border:1px solid transparent;border-left-width:4px;
 border-radius:10px;box-shadow:none;
}
.signup-note--pilot{background:#EEF5F0;border-color:#D6E7DB;border-left-color:#1E4D3B;color:#294638}
.signup-note--privacy{background:#FFF5E6;border-color:#EFD7AF;border-left-color:#A66F1E;color:#4B3B24}
.signup-note__heading{display:flex;align-items:center;gap:9px}
.signup-note--pilot .signup-note__heading{color:#1E4D3B}
.signup-note--privacy .signup-note__heading{color:#704B1A}
.signup-note__heading h2{margin:0;font-size:14px;font-weight:700;line-height:1.35;letter-spacing:0}
.signup-note__icon{
 display:inline-flex;justify-content:center;align-items:center;flex:0 0 21px;
 width:21px;height:21px;border:1.5px solid currentColor;border-radius:50%;
 font-size:12px;font-weight:700;line-height:1;
}
.signup-note .public-intro,.signup-note .public-privacy{
 margin:0;color:inherit;font-size:14px;line-height:1.55;overflow-wrap:break-word;
}
@media(max-width:767px){
 .signup-note{padding:12px 13px;gap:7px}
 .signup-note__heading{gap:8px}
}

/* Landing de navegação: única função é testar o encaminhamento para o acesso */
.landing-placeholder{display:grid;align-content:center;gap:18px;max-width:360px;width:100%;margin:auto;min-height:calc(100dvh - 90px);padding:20px}
.landing-placeholder button{min-height:56px;font-size:16px}
.landing-visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:767px){.landing-placeholder{min-height:calc(100dvh - 70px);padding:16px;gap:14px}}

function readDiscount(kind,value){
 const parsed=kind==='fixed'?cents(value):kind==='percent'?Math.min(100,Math.max(0,Number(value)||0)):0;
 return {kind:parsed?kind:'none',value:parsed};
}
const discountValue=d=>d.kind==='fixed'?d.value/100:d.value;
const lineTotal=line=>line.unit*line.qty-discountFor(line.unit*line.qty,line.discount);
function cartTotals(){
 const gross=cart.reduce((sum,line)=>sum+line.unit*line.qty,0);
 const afterItems=cart.reduce((sum,line)=>sum+lineTotal(line),0);
 const afterGeneral=afterItems-discountFor(afterItems,saleDiscount);
 const total=afterGeneral-(coupon==='FEIRA10'?Math.round(afterGeneral*.1):0);
 return {gross,total,discount:gross-total};
}
function paymentTotals(){
 const registered=payments.reduce((sum,p)=>sum+p.amount,0);
 const received=payments.filter(p=>!p.scheduled).reduce((sum,p)=>sum+p.amount,0);
 const total=cartTotals().total;
 return {registered,received,scheduled:registered-received,free:Math.max(0,total-registered),remaining:Math.max(0,total-received),
  change:payments.reduce((sum,p)=>sum+p.change,0)};
}
function planStock(lines=cart,event=active()){
 const byProduct=new Map();
 const summary={fair:0,central:0,consigned:0,pending:0,lots:[]};
 const sources=[];
 for(const line of lines){
  const from=[];
  if(!byProduct.has(line.id))byProduct.set(line.id,{...origins(line.id,event),lots:(data.lots[line.id]??[]).map(lot=>({...lot}))});
  const balances=byProduct.get(line.id);
  let left=line.qty;
  for(const origin of ['fair','central']){
   const used=Math.min(left,balances[origin]);balances[origin]-=used;summary[origin]+=used;left-=used;
   if(used)from.push({origin,qty:used});
  }
  for(const lot of balances.lots){
   const used=Math.min(left,lot.qty);lot.qty-=used;left-=used;summary.consigned+=used;
   if(used){const item={product:line.id,lot:lot.id,supplier:lot.supplier,qty:used};summary.lots.push(item);from.push({origin:'consigned',...item});}
  }
  summary.pending+=left;
  if(left)from.push({origin:'pending',qty:left});
  sources.push(from);
 }
 return {summary,byProduct,sources};
}
const originNames={fair:'Feira',central:'Principal',consigned:'Consignado',pending:'Pendência'};
function applyStockPlan(plan,event,lines){
 for(const [id,balance] of plan.byProduct){
  if(event)event.fair[id]=balance.fair;
  data.central[id]=balance.central;
  if(data.lots[id])data.lots[id]=balance.lots;
 }
 lines.forEach((line,i)=>{
  const shortage=sum(plan.sources[i].filter(item=>item.origin==='pending'),item=>item.qty);
  if(shortage)data.deficits[line.id]=(data.deficits[line.id]??0)+shortage;
 });
}
function applyStockSelection(session,selection){
 for(const p of products)data.central[p.id]=(data.central[p.id]??0)+(session.fair[p.id]??0)-(selection[p.id]??0);
 session.fair={...selection};
}

function snapshotLines(lines,total,sources){
 const afterItems=sum(lines,lineTotal);
 let prior=0;
 return lines.map((line,i)=>{
  const from=prior;
  prior+=lineTotal(line);
  const effective=afterItems?Math.floor(prior*total/afterItems)-Math.floor(from*total/afterItems):0;
  return {id:line.id,qty:line.qty,unit:line.unit,total:effective,sources:sources[i],returned:0};
 });
}
function recordSale(lines,totals,event,parts,change=0,exchangeOf=null){
 const plan=planStock(lines,event);
 applyStockPlan(plan,event,lines);
 const received=sum(parts.filter(p=>!p.scheduled),p=>p.amount);
 const sale={id:data.nextSale++,sessionId:event?.id??null,sessionName:event?eventName(event):'',...totals,
  received,change,stock:plan.summary,payments:[...parts],lines:snapshotLines(lines,totals.total,plan.sources),
  sync:data.offline?'pending':'synced',returns:[],refunds:[],exchangeCredit:0,exchangeOf};
 data.sales.push(sale);
 return sale;
}
function saleBalance(sale){
 const returns=sum(sale.returns,r=>r.value),refunds=sum(sale.refunds,r=>r.amount);
 const net=sale.total-returns,received=sum(sale.payments.filter(p=>!p.scheduled),p=>p.amount);
 const scheduled=sum(sale.payments.filter(p=>p.scheduled),p=>p.amount);
 const applied=received-refunds-sale.exchangeCredit;
 return {returns,refunds,net,received,scheduled,due:Math.max(0,net-applied),
  free:Math.max(0,net-applied-scheduled),refundAvailable:Math.max(0,applied-net)};
}

function updateReturn(){
 const sale=operationSale(),items=returningLines();
 const value=sum(items,r=>returnValue(r.line,r.qty));
 $('return-total').textContent='Valor efetivo devolvido '+money(value);
 if(!returnDraft.all){
  $('return-qty').textContent=returnDraft.qty;
  const row=$('return-qty');
  row.previousElementSibling.disabled=returnDraft.qty<=1;
  row.nextElementSibling.disabled=returnDraft.qty>=items[0].line.qty-items[0].line.returned;
 }
 if(returnDraft.exchange){
  const id=returnDraft.replacement;
  $('confirm-return').disabled=!id;
  if(id){
   const replacement=replacementPrice(sale,id),balance=saleBalance(sale);
   const credit=Math.min(value,replacement,Math.max(0,balance.received-balance.refunds-sale.exchangeCredit-(balance.net-value)));
   $('exchange-total').textContent='Reposição '+money(replacement)+' · crédito disponível '+money(credit)+' · saldo da reposição '+money(replacement-credit);
  }
 }
}
function returnStock(line,quantity,event,restock){
 let skip=line.returned,left=quantity;
 for(const source of line.sources){
  const before=Math.min(skip,source.qty);skip-=before;
  const qty=Math.min(left,source.qty-before);left-=qty;
  if(!qty)continue;
  if(source.origin==='pending'){data.deficits[line.id]=Math.max(0,(data.deficits[line.id]??0)-qty);continue;}
  if(!restock)continue;
  if(source.origin==='fair'&&event?.open)event.fair[line.id]=(event.fair[line.id]??0)+qty;
  else if(source.origin==='consigned')data.lots[line.id].find(lot=>lot.id===source.lot).qty+=qty;
  else data.central[line.id]+=qty;
 }
}
function commitReturn(){
 const sale=operationSale(),items=returningLines(),restock=$('restock').checked;
 if(!items.length||returnDraft.exchange&&!returnDraft.replacement)return;
 const event=data.sessions.find(s=>s.id===sale.sessionId);
 const value=sum(items,item=>returnValue(item.line,item.qty));
 for(const item of items){returnStock(item.line,item.qty,event,restock);item.line.returned+=item.qty;}
 sale.returns.push({value,restock,exchange:returnDraft.exchange,items:items.map(item=>({index:item.index,qty:item.qty}))});
 if(returnDraft.exchange){
  const id=returnDraft.replacement,total=replacementPrice(sale,id);
  const credit=Math.min(value,total,saleBalance(sale).refundAvailable);
  sale.exchangeCredit+=credit;
  const parts=credit?[{method:'exchange',amount:credit,scheduled:false}]:[];
  const replacement=recordSale([{id,qty:1,unit:total,discount:{kind:'none',value:0}}],
   {gross:total,discount:0,total},event?.open?event:null,parts,0,sale.id);
  operationSaleId=replacement.id;
 }
 persist();dialog.close();render();feedback(returnDraft.exchange?'Troca registrada.':'Devolução registrada.');
}

// Conferência e relatório de fechamento do evento.
let closingDiscard=false, countedCash='';
function eventReport(event){
 const sales=salesFor(event),payments={};
 let received=0,due=0,cashRefunds=0,returns=0;
 for(const sale of sales){
  const balance=saleBalance(sale);
  received+=balance.received-balance.refunds-sale.exchangeCredit;due+=balance.due;returns+=balance.returns;
  cashRefunds+=sum(sale.refunds.filter(r=>r.method==='cash'),r=>r.amount);
  for(const part of sale.payments.filter(p=>!p.scheduled)){
   payments[part.method]=(payments[part.method]??0)+part.amount;
  }
 }
 const supplies=sum(event.cashMoves.filter(m=>m.kind==='supply'),m=>m.amount);
 const withdrawals=sum(event.cashMoves.filter(m=>m.kind==='withdraw'),m=>m.amount);
 return {sales:sales.length,total:sum(sales,s=>s.total)-returns,returns,received,due,payments,supplies,withdrawals,cashRefunds,
  expected:(payments.cash??0)-cashRefunds+supplies-withdrawals,
  pending:sales.filter(s=>s.sync==='pending').length,visitors:event.visitors??0};
}
function reportCards(r){
 return card('<h2>Vendas e visitantes</h2>'+row('Total de vendas',money(r.total),'total')+row('Quantidade de vendas',r.sales)+
  (r.returns?row('Devoluções',money(r.returns)):'')+row('Saldo a receber',money(r.due))+row('Visitantes',r.visitors)+
  (r.pending?row('Vendas offline pendentes',r.pending):''))+
  card('<h2>Recebimentos por forma</h2>'+(Object.keys(r.payments).length?Object.entries(r.payments).map(([method,amount])=>row(methods[method],money(amount))).join(''):'<p class="muted">Nenhum pagamento recebido.</p>'));
}
function cashReport(r){
 return row('Dinheiro esperado',money(r.expected))+(r.supplies?row('Suprimentos',money(r.supplies)):'')+
  (r.withdrawals?row('Sangrias',money(r.withdrawals)):'')+(r.cashRefunds?row('Reembolsos em dinheiro',money(r.cashRefunds)):'');
}
function closingView(){
 const event=settingsSession(),report=eventReport(event);
 return {body:title('Fechamento do evento',esc(eventName(event)),'receipt')+reportCards(report)+

   <output id="cash-difference" class="total">${countedCash===''?'Informe o dinheiro contado.':'Diferença de caixa '+money(cents(countedCash)-report.expected)}</output>
   <p class="muted">A diferença fica registrada. As sobras da feira voltam ao principal.</p>`),
  foot:actions(btn('Voltar','closing-back'),btn('Encerrar evento','final-close',{style:'danger',disabled:countedCash===''}))};
}

}

function resumeSession(id){
 const session=data.sessions.find(s=>s.open&&s.id===id);
 if(!session)return;
 if(activeId!==id)resetCart();
 activeId=id;data.resumeId=id;persist();
 if(session.resume==='receipt'&&data.sales.some(s=>s.id===session.lastSale)){receiptId=session.lastSale;go('complete');}
 else openCatalog();
}
function readSessionDraft(){
 const name=$('session-name').value.trim(),date=$('session-date').value;
 Object.assign(sessionDraft,{name,date,tier:$('session-tier').value});
}
function canOpenEvent(){
 const stored=restore();
 if(!openEvent()&&stored.sessions.some(s=>s.open))data=stored;
 if(!openEvent())return true;
 go('entry');
 modal('Já existe um evento aberto','<p class="notice">Retome ou encerre o evento atual antes de criar outro.</p>');
 return false;
}
function startSession(){
 if(!canOpenEvent())return;
 readSessionDraft();
 if(!sessionDraft.date){
  modal('Confira o evento','<p class="notice">Informe a data do evento.</p>');return;
 }
 resetCart();
 const session={...sessionDraft,id:data.nextSession++,fair:{}};
 applyStockSelection(session,sessionDraft.fair);
 data.sessions.push(session);activeId=session.id;data.resumeId=activeId;persist();openCatalog();
}
function finishSale(){
 const totals=cartTotals(),paid=paymentTotals();
 if(!cart.length||paid.registered>totals.total||(paid.remaining&&!acknowledged))return;
 const session=active(),sale=recordSale(cart,totals,session,payments,paid.change);
 if(session){session.lastSale=sale.id;session.resume='receipt';data.resumeId=session.id;}
 receiptId=sale.id;resetCart();persist();go('complete');feedback('Venda registrada na demonstração.');
}
function updateStock(delta,id){
 stockDraft[id]=Math.max(0,Math.min(stockLimit(id),(stockDraft[id]??0)+delta));
 $('stock-list').innerHTML=stockRows();
 const focusAction=delta>0?'stock-plus':'stock-minus';
 const target=$('stock-list').querySelector('[data-id="'+id+'"][data-action="'+focusAction+'"]');
 if(!target.disabled)target.focus({preventScroll:true});
}
function addProduct(id){
 const tier=active()?.tier??'retail',unit=priceOf(id,tier);
 const line=cart.find(l=>l.id===id&&l.tier===tier&&l.unit===unit&&l.discount.kind==='none');
 if(line)line.qty++;
 else cart.push({id,tier,unit,original:unit,qty:1,discount:{kind:'none',value:0}});
 footer.innerHTML=catalogFooter();
}
function showSettings(){
 if(screen==='settings'||screen==='stock'||screen==='new-session')return;
 settingsDraft=null;
 settingsBack=screen;
 settingsId=activeId??openEvent()?.id;

}
function requestCloseSession(){
 const session=settingsSession();
 if(!session?.open)return;
 if(session.id===activeId&&cart.length){
  modal('Carrinho em andamento',`<div class="stack"><p>O evento <strong>${esc(eventName(session))}</strong> tem uma venda em andamento.</p>
   ${btn('Voltar ao evento','return-to-event',{style:'primary'})}
   ${btn('Descartar carrinho e encerrar evento','request-discard',{style:'danger'})}</div>`);
  return;
 }
 modal('Encerrar evento '+eventName(session)+'?',`<div class="stack">
  <p>Confira os valores e o estoque da feira antes de encerrar.</p>
  ${actions(btn('Cancelar','close'),btn('Conferir fechamento','confirm-close',{style:'primary'}))}</div>`);
}
function requestDiscard(){
 const session=settingsSession();
 if(!session?.open)return;
 modal('Descartar carrinho e encerrar?',`<div class="stack"><p>Confirme o descarte dos itens e pagamentos em andamento de <strong>${esc(eventName(session))}</strong>. O descarte ocorre ao concluir o fechamento.</p>
  <p class="muted">Os comprovantes e as vendas concluídas continuam no histórico.</p>
  ${btn('Voltar ao evento','return-to-event',{style:'primary'})}
  ${btn('Confirmar descarte e encerramento','confirm-discard',{style:'danger'})}</div>`);
}
function beginClosing(discard){
 const session=settingsSession();
 if(!session?.open||(session.id===activeId&&cart.length&&!discard))return;
 closingDiscard=discard;countedCash='';go('closing');
}
function closeSession(){
 const session=settingsSession();
 if(!session?.open||countedCash===''||(session.id===activeId&&cart.length&&!closingDiscard))return;
 const r=eventReport(session),counted=cents(countedCash);
 session.closedReport={...r,counted,difference:counted-r.expected,closedAt:new Date().toISOString()};
 applyStockSelection(session,{});session.open=false;
 if(activeId===session.id){activeId=null;data.resumeId=null;resetCart();}
 persist();go('report');feedback('Evento encerrado. Relatório disponível.');
}
function processAction(button,work){
 if(button.disabled)return;
 button.disabled=true;button.setAttribute('aria-busy','true');
 feedback('Processando na demonstração…');
 setTimeout(()=>{
  try{work();}finally{if(button.isConnected){button.disabled=false;button.removeAttribute('aria-busy');}}
 },140);
}

  }
  case 'remove-item':cart.splice(index,1);dialog.close();render();break;
  case 'sale-discount':
   modal('Desconto da venda',`<div class="stack">${choiceGroup('sale-discount-type','Tipo de desconto',discounts,saleDiscount.kind==='percent'?'percent':'fixed')}
    <label>Valor<input id="sale-discount-value" type="number" min="0" step=".01" value="${discountValue(saleDiscount)}"></label>
    ${btn('Aplicar desconto','save-sale-discount',{style:'primary'})}</div>`);break;
  case 'save-sale-discount':saleDiscount=readDiscount($('sale-discount-type').value,$('sale-discount-value').value);dialog.close();render();break;
  case 'coupon':
   modal('Cupom',`<div class="stack"><label>Código<input id="coupon" value="${esc(coupon)}"></label><small>Use FEIRA10 para simular 10% de desconto.</small>
    <p id="coupon-error" class="notice" hidden role="alert"></p>${btn('Aplicar cupom','save-coupon',{style:'primary'})}</div>`);break;
  case 'save-coupon':{
   const code=$('coupon').value.trim().toUpperCase();
   if(code&&code!=='FEIRA10'){$('coupon-error').textContent='Cupom de teste inválido.';$('coupon-error').hidden=false;break;}
   coupon=code;dialog.close();render();break;
  }
  case 'payment':acknowledged=false;go('payment');break;
  case 'payment-mode':mode=id;render();break;
  case 'toggle-payment-layout':data.simplePayment=!data.simplePayment;persist();render();feedback(data.simplePayment?'Pagamento compacto em avaliação.':'Pagamento com controles expandidos.');break;
  case 'select-payment':selectedPayment=id;render();break;
  case 'open-payment':paymentForm(id);break;
  case 'remove-payment':payments.splice(index,1);render();break;
  case 'generate-pix':{
   const field=$('payment-amount'),amount=cents(field.value);
   if(!field.reportValidity())break;
   if(!amount||amount>paymentTotals().free){
    $('payment-error').textContent='Informe um valor dentro do saldo disponível.';$('payment-error').hidden=false;break;
   }
   $('payment-error').hidden=true;
   $('pix-value').textContent='Valor do Pix '+money(amount);
   $('pix-preview').hidden=false;$('save-payment').disabled=!!$('pix-auto-status');
   break;
  }
  case 'pix-auto':
   processAction(trigger,()=>{
    const status=$('pix-auto-status');
    if(!status||$('pix-preview').hidden)return;
    status.textContent='Pix aprovado na simulação.';$('save-payment').disabled=false;
   });
   break;
  case 'copy-pix':{
   const field=$('pix-code'),status=$('copy-status');
   field.select();
   if(navigator.clipboard?.writeText)navigator.clipboard.writeText(field.value)
    .then(()=>status.textContent='Código fictício copiado.').catch(()=>status.textContent='Código selecionado para copiar.');
   else status.textContent='Código selecionado para copiar.';
   break;
  }
  case 'review':acknowledged=false;go('review');break;
  case 'finish':processAction(trigger,finishSale);break;
  case 'next-sale':
   resetCart();if(active()){active().resume='catalog';persist();}openCatalog();break;
  case 'receipt':openReceipt(receiptRecord(),id);break;
  case 'session-receipt':openReceipt(data.sales.find(s=>s.id===index));break;
  case 'sale-detail':operationBack=screen;operationSaleId=index;go('sale-detail');break;
  case 'operation-back':go(operationBack);break;
  case 'operation-receipt':openReceipt(operationSale());break;
  case 'later-payment':openFinanceOperation('payment');break;
  case 'refund':openFinanceOperation('refund');break;
  case 'return-item':openReturn(index);break;
  case 'return-all':openReturn(null);break;
  case 'exchange-item':openReturn(index,true);break;
  case 'return-plus':returnDraft.qty++;updateReturn();break;
  case 'return-minus':returnDraft.qty=Math.max(1,returnDraft.qty-1);updateReturn();break;
  case 'replacement':
   returnDraft.replacement=id;
   for(const option of dialog.querySelectorAll('[data-action=replacement]'))option.setAttribute('aria-pressed',String(option.dataset.id===id));
   updateReturn();break;
  case 'receipt-sim':$('receipt-status').textContent=id==='print'?'Impressão simulada.':'Envio simulado.';break;
  case 'settings':showSettings();break;
  case 'settings-back':go(settingsBack);break;
  case 'save-settings':{
   const session=settingsSession(),name=$('settings-name').value.trim();
   session.name=name;session.tier=$('settings-tier').value;settingsDraft=null;persist();render();
   modal('Configurações salvas','<p>Nome e tabela atualizados neste evento.</p>');break;
  }
  case 'visitors':modal('Corrigir total de visitantes',`<form id="visitors-form" class="stack"><label>Total de visitantes<input id="visitor-total" type="number" min="0" max="999999" step="1" inputmode="numeric" required value="${active().visitors??0}"></label><button class="primary">Salvar total</button></form>`);break;
  case 'visitor-add':active().visitors=Math.min(999999,(active().visitors??0)+1);persist();
   {const visitorButton=$('event-bar').querySelector('[data-action=visitors]');
   visitorButton.textContent=active().visitors+' visitantes';}break;
  case 'toggle-header':data.compactHeader=!data.compactHeader;persist();render();feedback(data.compactHeader?'Cabeçalho compacto em avaliação.':'Cabeçalho em duas linhas.');break;
  case 'toggle-pix':data.pixAutomatic=!data.pixAutomatic;persist();render();feedback(data.pixAutomatic?'Pix automático simulado ativado.':'Confirmação Pix manual ativada.');break;
  case 'toggle-offline':data.offline=!data.offline;persist();render();feedback(data.offline?'Modo offline simulado.':'Conexão simulada restabelecida.');break;
  case 'sync-sales':processAction(trigger,()=>{
   if(data.offline)return;
   let updated=0;
   for(const sale of data.sales){if(sale.sync==='pending'){sale.sync='synced';updated++;}}
   persist();render();feedback(updated+' venda(s) sincronizada(s). O número da venda foi preservado.');
  });break;
  case 'cash-move':modal('Movimentação do caixa',`<form id="cash-move-form" class="stack">
   ${choiceGroup('cash-move-kind','Operação',{supply:'Suprimento',withdraw:'Sangria'},'supply')}
   <label>Valor (R$)<input id="cash-move-value" type="number" min=".01" step=".01" required></label>
   <button class="primary">Registrar movimentação</button></form>`);break;
  case 'close-session':requestCloseSession();break;
  case 'return-to-event':go(settingsBack==='entry'?'cart':settingsBack);break;
  case 'request-discard':requestDiscard();break;
  case 'confirm-close':beginClosing(false);break;
  case 'confirm-discard':beginClosing(true);break;
  case 'closing-back':go('settings');break;
  case 'final-close':if($('counted-cash').reportValidity())processAction(trigger,closeSession);break;
  case 'show-report':go('report');break;
  case 'print-report':modal('Prévia do relatório',`<div class="stack"><h3>${esc(eventName(settingsSession()))}</h3>${reportCards(settingsSession().closedReport)}
   ${card(cashReport(settingsSession().closedReport)+row('Dinheiro contado',money(settingsSession().closedReport.counted))+
   row('Diferença de caixa',money(settingsSession().closedReport.difference)))}
   ${btn('Simular impressão','receipt-sim',{id:'print',style:'primary'})}<p id="receipt-status" role="status"></p></div>`);break;
 }
});
document.addEventListener('input',event=>{
 const field=event.target;
 if(field.id==='search'){search=field.value;$('catalog-grid').innerHTML=catalogCards();}
 else if(field.id==='stock-search'){stockSearch=field.value;$('stock-list').innerHTML=stockRows();}
 else if(field.id==='custom-price'){setChoice('item-tier','custom');refreshItemTotal();}
 else if(field.id==='item-discount-value')refreshItemTotal();
 else if(field.id==='payment-amount'&&paymentMethod==='cash')$('change').textContent='Troco '+money(Math.max(0,cents(field.value)-paymentTotals().free));
 else if(field.id==='payment-amount'&&paymentMethod==='pix'){
  $('pix-preview').hidden=true;
  if($('pix-confirmed'))$('pix-confirmed').checked=false;
  if($('pix-auto-status'))$('pix-auto-status').textContent='';
  $('save-payment').disabled=true;
 }else if(field.id==='counted-cash'){
  countedCash=field.value;
  $('cash-difference').textContent=countedCash===''?'Informe o dinheiro contado.':'Diferença de caixa '+money(cents(countedCash)-eventReport(settingsSession()).expected);
  footer.querySelector('[data-action=final-close]').disabled=countedCash==='';
 }
});
document.addEventListener('change',event=>{
 const field=event.target;
 if(field.id==='acknowledge'){acknowledged=field.checked;footer.querySelector('[data-action=finish]').disabled=!acknowledged;}
});
document.addEventListener('submit',event=>{
 event.preventDefault();
 if(event.target.id==='admin-access-form'){
  if(!event.target.reportValidity())return;
  localStorage.setItem('pdv-v3-mock-logged-out','admin');go('admin-home');return;
 }
 if(event.target.id==='interest-form'){
  if(!event.target.reportValidity())return;
  $('interest-status').textContent='Solicitação preenchida. A participação depende de análise e convite.';
  return;
 }
 if(event.target.id==='visitors-form'){
  active().visitors=Number($('visitor-total').value);persist();dialog.close();render();feedback('Contagem atualizada.');return;
 }
 if(event.target.id==='cash-move-form'){
  settingsSession().cashMoves.push({kind:$('cash-move-kind').value,amount:cents($('cash-move-value').value)});
  persist();dialog.close();render();feedback('Movimentação registrada.');return;
 }
 if(event.target.id==='finance-operation'){
  const sale=operationSale(),value=cents($('operation-amount').value),method=$('operation-method').value,kind=event.target.dataset.kind;
  if(kind==='refund'&&value<=saleBalance(sale).refundAvailable)sale.refunds.push({method,amount:value});
  else if(kind==='payment'&&value<=saleBalance(sale).free)sale.payments.push({method,amount:value,later:true,scheduled:false,confirmation:'manual'});
  else return;
  persist();dialog.close();render();feedback(kind==='refund'?'Reembolso registrado.':'Recebimento posterior registrado.');return;
 }
 if(event.target.id==='return-operation'){commitReturn();return;}
 if(event.target.id!=='payment-form')return;
 const free=paymentTotals().free,offered=cents($('payment-amount').value);
 if(!free||!offered||(paymentMethod!=='cash'&&offered>free)){
  $('payment-error').textContent='Informe um valor válido dentro do saldo para este meio.';$('payment-error').hidden=false;return;
 }
 if(paymentMethod==='pix'&&$('save-payment').disabled)return;
 payments.push({method:paymentMethod==='card'?$('card-kind').value:paymentMethod,amount:Math.min(offered,free),
  confirmation:paymentMethod==='pix'&&$('pix-auto-status')?'automatic':'manual',
  scheduled:!!$('schedule')?.checked,change:paymentMethod==='cash'?Math.max(0,offered-free):0});
 dialog.close();render();
});
$('back').innerHTML=icon('back');
$('header-alerts-icon').innerHTML=icon('bell');
$('header-settings-icon').innerHTML=icon('settings');
$('header-exit-icon').innerHTML=icon('logout');
$('nav-pdv-icon').innerHTML=icon('store');
$('nav-products-icon').innerHTML=icon('box');
$('nav-sales-icon').innerHTML=icon('file');
$('nav-more-icon').innerHTML=icon('menu');
$('dialog-close').innerHTML=icon('close');
document.documentElement.style.setProperty('--product-photos','url("data:image/jpeg;base64,'+$('product-photo-asset').textContent+'")');
render();
</script>
<script src="produtos.js"></script>
</body>
</html>
